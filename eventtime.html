<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ICB Event Time</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #box { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 14px; font-family: "Baloo 2", "Comic Sans MS", "Trebuchet MS", sans-serif; color: #fff; transition: opacity .4s; }
  #box.hidden { opacity: 0; }
  .card { background: rgba(28,14,40,.86); border: 4px solid rgba(255,255,255,.85); border-radius: 26px; padding: 14px 20px 16px; box-shadow: 0 8px 0 rgba(58,20,70,.45); }
  .title { text-align: center; font-size: 40px; font-weight: 900; line-height: 1.1; padding: 6px 26px; margin: 0 auto 6px; border-radius: 18px; display: table;
    background: linear-gradient(90deg, rgba(120,40,150,.95), rgba(220,80,170,.95)); text-shadow: 0 3px 0 #3a1446; }
  .subtitle { text-align: center; font-size: 22px; font-weight: 800; color: #ffd6f2; margin-bottom: 4px; }
  .cd { text-align: center; font-size: 22px; font-weight: 800; color: #ffe66d; margin-bottom: 8px; text-shadow: 0 2px 0 #000; }
  .zones { display: flex; justify-content: center; }
  .zones.column { flex-direction: column; }
  .zone { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.35); border-radius: 18px; padding: 8px 16px; text-align: center; min-width: 150px; }
  .zones.row .zone + .zone { margin-left: 12px; }
  .zones.column .zone + .zone { margin-top: 8px; }
  .zones.column .zone { display: flex; align-items: center; text-align: left; min-width: 0; }
  .zones.column .zone .lab { width: 120px; }
  .zones.column .zone .day { flex: 1; margin-right: 14px; }
  .lab { font-size: 22px; font-weight: 900; color: #ff9fe0; letter-spacing: .5px; }
  .day { font-size: 20px; font-weight: 800; color: #d9ccff; }
  .tm { font-size: 34px; font-weight: 900; line-height: 1.05; text-shadow: 0 3px 0 rgba(0,0,0,.5); white-space: nowrap; }
  .zone.home { border-color: #ffe66d; background: rgba(255,230,109,.14); }
  .empty { text-align: center; font-size: 22px; opacity: .8; padding: 8px; }
</style>
</head>
<body>
<div id="box" class="hidden"><div class="card">
  <div class="title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>
  <div class="cd" id="cd"></div>
  <div class="zones row" id="zones"></div>
</div></div>
<script>
// ICB Event Time converter overlay (Baby, 2026-10-06). Meld layer:
//   http://127.0.0.1:8790/eventtime.html  (any size - scales to fit)
// Plain ES5 (Meld rule). Polls /api/eventtime every 2 s.
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var box = $('box'), state = null, skew = 0, lastKey = '';

  function fit(){
    box.style.transform = 'none';
    var w = window.innerWidth || document.documentElement.clientWidth || 1600;
    var h = window.innerHeight || document.documentElement.clientHeight || 400;
    var bw = box.offsetWidth || 1, bh = box.offsetHeight || 1;
    var s = Math.min(w / bw, h / bh); if (!(s > 0)) s = 1;
    box.style.transform = 'scale(' + s + ')'; box.style.webkitTransform = 'scale(' + s + ')';
    box.style.left = Math.max(0, (w - bw * s) / 2) + 'px';
  }
  window.addEventListener('resize', fit);

  function fmt(ms, tz, opts){ var o = { timeZone: tz }; for (var k in opts) o[k] = opts[k]; return new Intl.DateTimeFormat('en-US', o).format(new Date(ms)); }
  function abbr(ms, tz){
    try {
      var parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short' }).formatToParts(new Date(ms));
      for (var i = 0; i < parts.length; i++) if (parts[i].type === 'timeZoneName') return parts[i].value.replace(/^GMT\+(\d)/, 'GMT +$1');
    } catch (e) {}
    return tz;
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

  function render(){
    var d = state; if (!d) return;
    box.className = d.visible ? '' : 'hidden';
    $('title').textContent = d.title || 'Next Event';
    $('subtitle').textContent = d.subtitle || ''; $('subtitle').style.display = d.subtitle ? '' : 'none';
    var key = JSON.stringify([d.at, d.zones, d.layout, d.sourceTz]);
    if (key !== lastKey) {
      lastKey = key;
      var html = '';
      if (!d.at) html = '<div class="empty">Set the event time on the dashboard</div>';
      else for (var i = 0; i < d.zones.length; i++) {
        var z = d.zones[i]; if (!z.visible) continue;
        var lab = z.label || abbr(d.at, z.tz);
        html += '<div class="zone' + (z.tz === d.sourceTz ? ' home' : '') + '"><div class="lab">' + esc(lab) + '</div>' +
          '<div class="day">' + esc(fmt(d.at, z.tz, { weekday: 'short', month: 'short', day: 'numeric' })) + '</div>' +
          '<div class="tm">' + esc(fmt(d.at, z.tz, { hour: 'numeric', minute: '2-digit' })) + '</div></div>';
      }
      $('zones').className = 'zones ' + (d.layout === 'column' ? 'column' : 'row');
      $('zones').innerHTML = html;
    }
    tick();
    fit();
  }

  function tick(){
    var d = state, el = $('cd'); if (!d) return;
    if (!d.at || !d.showCountdown) { el.style.display = 'none'; return; }
    el.style.display = '';
    var left = Math.round((d.at - (new Date().getTime() + skew)) / 1000);
    if (left <= 0) { el.textContent = left > -3600 ? '🎉 Happening now! 🎉' : 'This event has started'; return; }
    var dd = Math.floor(left / 86400), hh = Math.floor(left % 86400 / 3600), mm = Math.floor(left % 3600 / 60), ss = left % 60;
    el.textContent = 'Starts in ' + (dd ? dd + 'd ' : '') + (dd || hh ? hh + 'h ' : '') + mm + 'm' + (dd ? '' : ' ' + ('0' + ss).slice(-2) + 's');
  }
  setInterval(tick, 1000);

  function poll(){
    var x = new XMLHttpRequest();
    x.open('GET', '/api/eventtime?_=' + new Date().getTime(), true);
    x.onreadystatechange = function(){
      if (x.readyState !== 4 || x.status !== 200) return;
      try { var d = JSON.parse(x.responseText); if (d && d.ok) { skew = (d.now || 0) - new Date().getTime(); state = d; render(); } } catch (e) {}
    };
    x.send();
  }
  poll(); setInterval(poll, 2000);
})();
</script>
</body>
</html>
