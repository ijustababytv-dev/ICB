<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Report — ijustababyTV</title>
<style>
  :root{ --ink:#2a1633; --dim:#7a6484; --line:#ecdcf0; --pink:#d64fc4; --purple:#8b5cf6; --soft:#fbf4fd; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#f4ecf7; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .toolbar{ position:sticky; top:0; z-index:5; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    padding:12px 24px; background:#1e1728; color:#f3e8ff; }
  .toolbar label{ font-size:12px; color:#b6a3cc; }
  .toolbar select{ font-size:14px; padding:6px 10px; border-radius:8px; border:1px solid #3a2a4d; background:#0d0a14; color:#f3e8ff; }
  .toolbar button{ font-size:13px; font-weight:700; border:none; border-radius:8px; padding:8px 14px; cursor:pointer; }
  .b-print{ background:#e879e0; color:#1c0f1f; } .b-csv{ background:#a78bfa; color:#160f28; }
  .toolbar .spacer{ flex:1; } .toolbar a{ color:#b6a3cc; font-size:12px; }
  .page{ max-width:980px; margin:24px auto 60px; background:#fff; border-radius:14px; padding:36px 40px; box-shadow:0 8px 30px rgba(60,0,70,0.12); }
  h1{ margin:0; font-size:26px; } h1 span{ color:var(--pink); }
  .meta{ color:var(--dim); font-size:13px; margin:4px 0 22px; }
  h2{ font-size:16px; margin:28px 0 10px; padding-bottom:6px; border-bottom:2px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; }
  h2 small{ font-size:12px; color:var(--dim); font-weight:500; }
  .cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .c{ background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .c .n{ font-size:22px; font-weight:800; color:var(--pink); } .c .l{ font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .c .x{ font-size:11px; color:var(--dim); margin-top:2px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); padding:6px 8px; border-bottom:1px solid var(--line); }
  td{ padding:6px 8px; border-bottom:1px solid #f5ecf7; vertical-align:top; }
  td.num, th.num{ text-align:right; white-space:nowrap; } td.t{ color:var(--dim); white-space:nowrap; width:80px; }
  .none{ color:var(--dim); font-size:13px; font-style:italic; padding:6px 0; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .tag{ display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:#f3e3f7; color:#8a3c99; font-weight:700; }
  .foot{ margin-top:30px; font-size:11px; color:var(--dim); }
  .spark{ width:100%; height:90px; background:var(--soft); border:1px solid var(--line); border-radius:10px; }
  .names{ font-size:12.5px; line-height:1.7; color:var(--ink); }
  .names span{ display:inline-block; margin:0 10px 0 0; }
  .names span.lurk{ color:var(--dim); }
  td.msg{ word-break:break-word; }
  @media print{ body:not(.print-long) .long{ display:none; } }
  .empty-night{ text-align:center; padding:60px 20px; color:var(--dim); }
  @media (max-width:760px){ .cards{ grid-template-columns:repeat(2,1fr); } .two{ grid-template-columns:1fr; } .page{ padding:22px; } }
  @media print{
    body{ background:#fff; } .toolbar{ display:none; }
    .page{ box-shadow:none; margin:0; max-width:none; padding:0; border-radius:0; }
    h2{ break-after:avoid; } tr{ break-inside:avoid; } .c{ break-inside:avoid; }
    @page{ margin:14mm; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <label for="night">Night</label>
  <select id="night"></select>
  <button class="b-print" onclick="window.print()">🖨 Print / Save as PDF</button>
  <label style="display:flex; gap:6px; align-items:center; color:#f3e8ff; font-size:12px;"><input type="checkbox" id="printLong"> Include full chat log &amp; transcript when printing</label>
  <button class="b-csv" onclick="downloadCsv()">⬇ Download spreadsheet (CSV)</button>
  <span class="spacer"></span>
  <a href="/giveaway-control.html">← Giveaway dashboard</a>
</div>
<div class="page" id="page"><div class="empty-night">Loading…</div></div>

<script>
  const $ = id => document.getElementById(id);
  let current = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const time = iso => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const longDate = key => { const [y,m,d] = key.split('-').map(Number); return new Date(y, m-1, d).toLocaleDateString([], { weekday:'long', month:'long', day:'numeric', year:'numeric' }); };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const TIER = { TIER_1:'Tier 1', TIER_2:'Tier 2', TIER_3:'Tier 3', TWITCH_PRIME:'Prime' };
  const tier = t => TIER[t] || (t ? t.replace(/_/g,' ').toLowerCase() : '');
  const subKind = e => e.subType === 'RESUB' ? 'Resub' : (e.subType ? 'New sub' : 'Sub');
  const KIND = { unicorns:'fluffy unicorns', subMonths:'months subbed', giftedSubs:'gifted subs', bits:'bits' };

  // Raw Firehose events (the listener's catch-all). Field names vary by
  // platform/event, so these helpers look in the usual places and fall back
  // to a short "key: value" summary rather than dropping anything.
  const RAW_HANDLED = new Set(['chat','sub','gifts','follow','raid','viewer_count','viewer_list','stream_status','purchase','stt','meld','connection']);
  function nameOf(v){ if (!v) return ''; if (typeof v === 'string') return v; return v.displayname || v.username || v.name || ''; }
  function whoIn(d){ return nameOf(d && (d.sender || d.follower || d.subscriber || d.purchaser || d.host || d.gifter || d.user || d.viewer || d.liker)); }
  function textOf(d){
    if (!d) return '';
    for (const k of ['text','message','content','body','transcript']) if (typeof d[k] === 'string' && d[k]) return d[k];
    for (const k of ['parts','fragments','message_parts','segments']) if (Array.isArray(d[k])) {
      const t = d[k].map(p => typeof p === 'string' ? p : (p && (p.text || p.content || p.name) || '')).join('');
      if (t.trim()) return t;
    }
    return '';
  }
  const SKIP_SUM = new Set(['event_type','timestamp','id','UPID','upid','platform_id','streamer','sender','follower','subscriber','purchaser','host','gifter','user','donations','attributes','text','message','parts','fragments','viewers']);
  function summary(d, max = 8){
    if (!d || typeof d !== 'object') return esc(String(d ?? ''));
    const out = [];
    for (const [k, v] of Object.entries(d)) {
      if (SKIP_SUM.has(k) || v === null || v === '' || typeof v === 'object') continue;
      out.push(`${k.replace(/_/g,' ')}: ${v}`);
      if (out.length >= max) break;
    }
    return esc(out.join(' · '));
  }
  function sparkline(points){
    if (points.length < 2) return '';
    const t0 = points[0].t, t1 = points[points.length - 1].t, max = Math.max(...points.map(p => p.v), 1);
    const W = 900, H = 90, pad = 6;
    const xy = points.map(p => `${pad + (W - 2*pad) * (p.t - t0) / Math.max(1, t1 - t0)},${H - pad - (H - 2*pad) * p.v / max}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${xy}" fill="none" stroke="#d64fc4" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>`;
  }

  async function init(){
    $('printLong').onchange = e => document.body.classList.toggle('print-long', e.target.checked);
    const r = await (await fetch('/api/activity/nights')).json();
    const nights = r.nights.slice();
    if (!nights.includes(r.tonight)) nights.unshift(r.tonight);
    $('night').innerHTML = nights.map(n => `<option value="${n}">${longDate(n)}${n === r.tonight ? ' (tonight)' : ''}</option>`).join('');
    $('night').onchange = () => load($('night').value);
    load(nights[0]);
  }

  async function load(key){
    $('page').innerHTML = '<div class="empty-night">Loading…</div>';
    current = await (await fetch('/api/activity/night?date=' + encodeURIComponent(key))).json();
    render(current);
  }

  function table(headers, rows){
    if (!rows.length) return '<div class="none">None this night.</div>';
    return `<table><thead><tr>${headers.map(h => `<th class="${h.num ? 'num' : ''}">${h.label}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${headers[i].num ? 'num' : ''}${headers[i].t ? ' t' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }

  function render(d){
    const ev = d.events;
    const by = t => ev.filter(e => e.type === t);
    const chats = by('chat'), follows = by('follow'), subs = by('sub'), gifts = by('gifts'), bits = by('bits'),
          raids = by('raid'), ticks = by('chat_unicorns'), manual = by('manual'), winners = by('winner');
    const sum = (a, f) => a.reduce((n, e) => n + (Number(f(e)) || 0), 0);
    const raw = ev.filter(e => e.type === 'raw');
    const rk = k => raw.filter(e => e.kind === k);
    const rawChats = rk('chat');
    const vc = rk('viewer_count').map(e => ({ t: Date.parse(e.at), v: Number(e.data && e.data.count) })).filter(p => Number.isFinite(p.v));
    const peak = vc.length ? Math.max(...vc.map(p => p.v)) : null;
    const avg = vc.length ? Math.round(vc.reduce((n, p) => n + p.v, 0) / vc.length) : null;
    const peakAt = vc.length ? vc.find(p => p.v === peak).t : null;
    const seen = new Set();
    rk('viewer_list').forEach(e => { const list = (e.data && (e.data.viewers || e.data.users || e.data.list)) || []; (Array.isArray(list) ? list : []).forEach(v => { const n = nameOf(v); if (n && !/^\+\d+ more$/.test(n)) seen.add(n); }); });
    const chatNames = new Set(rawChats.map(e => whoIn(e.data)).concat(chats.map(e => e.username)));
    chatNames.forEach(n => n && seen.add(n));
    const blockedSet = new Set((d.blocked || []).map(n => String(n).toLowerCase()));
    [...seen].forEach(n => { if (blockedSet.has(String(n).toLowerCase())) seen.delete(n); });
    const timeline = raw.filter(e => e.kind === 'stream_status' || e.kind === 'connection' || String(e.kind).startsWith('meld.'));
    const tips = [];
    rawChats.forEach(e => (e.data && Array.isArray(e.data.donations) ? e.data.donations : []).forEach(dn => {
      if (dn && dn.type && dn.type !== 'TWITCH_BITS') tips.push({ at: e.at, who: whoIn(e.data), type: String(dn.type).replace(/_/g,' ').toLowerCase(), amount: dn.amount, currency: dn.currency || '', count: dn.count || 1, text: textOf(e.data) });
    }));
    const purchases = rk('purchase');
    const highlighted = rawChats.filter(e => e.data && Array.isArray(e.data.attributes) && e.data.attributes.some(a => /HIGHLIGHTED|ANNOUNCEMENT/.test(String(a))));
    const stt = rk('stt');
    const other = raw.filter(e => !RAW_HANDLED.has(e.kind) && !String(e.kind).startsWith('meld.'));

    if (!ev.length) {
      $('page').innerHTML = `<h1>Stream Report <span>🦄</span></h1><div class="meta">${longDate(d.date)}</div>
        <div class="empty-night">Nothing recorded for this night yet.<br><br>Activity is logged live while ICB and the Meld listener layer are running — chats, follows, subs, gifted subs, cheers, raids, and giveaway activity.</div>`;
      return;
    }

    // Chatters + chat unicorns
    const chatters = {};
    chats.forEach(e => { (chatters[e.username] ||= { msgs: 0, uni: 0 }).msgs++; });
    ticks.forEach(t => t.usernames.forEach(u => { (chatters[u] ||= { msgs: 0, uni: 0 }).uni += (t.each || 1); }));
    const chatterRows = Object.entries(chatters).sort((a, b) => b[1].msgs - a[1].msgs || b[1].uni - a[1].uni);

    const subMonths = sum(subs.filter(e => !e.blocked), e => e.months), giftCount = sum(gifts, e => e.count), bitTotal = sum(bits, e => e.amount);
    const gifters = new Set(gifts.map(e => e.username)).size;
    const unicornsOut = sum(ticks, t => t.usernames.length * (t.each || 1)) + sum(subs, e => e.unicorns) + sum(gifts, e => e.unicorns) + sum(bits, e => e.unicorns) + sum(manual, e => e.unicorns);
    const first = ev[0].at, last = ev[ev.length - 1].at;

    // Supporters: everyone who followed / subbed / gifted / cheered / raided
    const sup = {};
    const S = n => (sup[n] ||= { follow: false, months: 0, gifts: 0, bits: 0, raid: 0 });
    follows.forEach(e => S(e.username).follow = true);
    subs.forEach(e => S(e.username).months += e.months || 1);
    gifts.forEach(e => S(e.username).gifts += e.count || 0);
    bits.forEach(e => S(e.username).bits += e.amount || 0);
    raids.forEach(e => { if (e.username) S(e.username).raid += e.viewers || 0; });
    const supRows = Object.entries(sup).sort((a, b) => (b[1].gifts * 5 + b[1].months * 5 + b[1].bits / 100) - (a[1].gifts * 5 + a[1].months * 5 + a[1].bits / 100) || a[0].localeCompare(b[0]));

    $('page').innerHTML = `
      <h1>Stream Report <span>🦄</span></h1>
      <div class="meta">${longDate(d.date)} · activity from ${time(first)} to ${time(last)} · ijustababyTV</div>

      <div class="cards">
        <div class="c"><div class="n">${follows.length}</div><div class="l">New follows</div></div>
        <div class="c"><div class="n">${subs.length}</div><div class="l">Subs &amp; resubs</div><div class="x">${plural(subMonths, 'month')}</div></div>
        <div class="c"><div class="n">${giftCount}</div><div class="l">Gifted subs</div><div class="x">from ${plural(gifters, 'gifter')}</div></div>
        <div class="c"><div class="n">${bitTotal.toLocaleString()}</div><div class="l">Bits cheered</div><div class="x">${plural(bits.length, 'cheer')}</div></div>
        <div class="c"><div class="n">${raids.length}</div><div class="l">Raids</div><div class="x">${sum(raids, e => e.viewers)} viewers</div></div>
        <div class="c"><div class="n">${Object.keys(chatters).length}</div><div class="l">Chatters</div><div class="x">${chats.length.toLocaleString()} messages</div></div>
        <div class="c"><div class="n">${unicornsOut.toLocaleString()}</div><div class="l">Fluffy unicorns given</div></div>
        <div class="c"><div class="n">${winners.length}</div><div class="l">Giveaway winners</div></div>
        <div class="c"><div class="n">${peak ?? '—'}</div><div class="l">Peak viewers</div><div class="x">${peakAt ? 'at ' + time(new Date(peakAt).toISOString()) : 'no viewer counts yet'}</div></div>
        <div class="c"><div class="n">${avg ?? '—'}</div><div class="l">Average viewers</div></div>
        <div class="c"><div class="n">${seen.size}</div><div class="l">Different people</div><div class="x">watched or chatted</div></div>
        <div class="c"><div class="n">${tips.length + purchases.length}</div><div class="l">Tips &amp; purchases</div><div class="x">${plural(tips.length, 'tip')} · ${plural(purchases.length, 'purchase')}</div></div>
      </div>

      ${vc.length > 1 ? `<h2>Viewers over the stream <small>peak ${peak} · average ${avg}</small></h2>${sparkline(vc)}
        <div class="meta" style="margin:4px 0 0; display:flex; justify-content:space-between;"><span>${time(new Date(vc[0].t).toISOString())}</span><span>${time(new Date(vc[vc.length-1].t).toISOString())}</span></div>` : ''}

      <h2>Supporters <small>everyone who followed, subbed, gifted, cheered or raided</small></h2>
      ${table([{label:'Viewer'},{label:'Followed'},{label:'Sub months',num:1},{label:'Gifted subs',num:1},{label:'Bits',num:1},{label:'Raid viewers',num:1}],
        supRows.map(([n, s]) => [esc(n), s.follow ? '✓' : '', s.months || '', s.gifts || '', s.bits ? s.bits.toLocaleString() : '', s.raid || '']))}

      <h2>Follows <small>${follows.length}</small></h2>
      ${table([{label:'Time',t:1},{label:'Viewer'}], follows.map(e => [time(e.at), esc(e.username)]))}

      <h2>Subs &amp; resubs <small>${plural(subMonths, 'month')}</small></h2>
      ${table([{label:'Time',t:1},{label:'Viewer'},{label:'Type'},{label:'Tier'},{label:'Months',num:1},{label:'🦄 earned',num:1}],
        subs.map(e => [time(e.at), esc(e.username) + (e.blocked ? ' <span class="tag">not in giveaway</span>' : ''), subKind(e), tier(e.tier), e.months || 1, e.blocked ? '—' : (e.unicorns ?? '')]))}

      <h2>Gifted subs <small>${giftCount} total</small></h2>
      ${table([{label:'Time',t:1},{label:'Gifter'},{label:'Subs',num:1},{label:'Tier'},{label:'Went to'},{label:'🦄 earned',num:1}],
        gifts.map(e => [time(e.at), esc(e.username), e.count, tier(e.tier), esc((e.recipients || []).join(', ')), e.blocked ? '—' : (e.unicorns ?? '')]))}

      <h2>Cheers <small>${bitTotal.toLocaleString()} bits</small></h2>
      ${table([{label:'Time',t:1},{label:'Viewer'},{label:'Bits',num:1},{label:'🦄 earned',num:1}],
        bits.map(e => [time(e.at), esc(e.username), (e.amount || 0).toLocaleString(), e.blocked ? '—' : (e.unicorns ?? '')]))}

      <h2>Raids <small>${raids.length}</small></h2>
      ${table([{label:'Time',t:1},{label:'Raider'},{label:'Viewers',num:1}], raids.map(e => [time(e.at), esc(e.username || 'unknown'), e.viewers || 0]))}

      <h2>Giveaway winners <small>${winners.length}</small></h2>
      ${table([{label:'Time',t:1},{label:'Winner'},{label:'Prize'},{label:'Their 🦄',num:1},{label:'🦄 in the drawing',num:1}],
        winners.map(e => [time(e.at), esc(e.username), e.prize === 'mystery-outfit' ? 'Mystery Outfit' : 'Plushie', e.unicorns ?? '', e.poolSize ?? '']))}

      <h2>Tips &amp; donations <small>Super Chats, Fourthwall, Kick, TikTok…</small></h2>
      ${table([{label:'Time',t:1},{label:'Viewer'},{label:'Type'},{label:'Amount',num:1},{label:'Message'}],
        tips.map(t => [time(t.at), esc(t.who), esc(t.type), esc(`${t.amount ?? ''} ${t.currency}`.trim()) + (t.count > 1 ? ` ×${t.count}` : ''), `<span class="msg">${esc(t.text)}</span>`]))}

      <h2>Shop purchases <small>${purchases.length}</small></h2>
      ${table([{label:'Time',t:1},{label:'Buyer'},{label:'Amount',num:1},{label:'Details'}],
        purchases.map(e => [time(e.at), esc(whoIn(e.data)), esc(`${e.data && e.data.total_amount != null ? e.data.total_amount : ''} ${(e.data && e.data.currency) || ''}`.trim()), summary(e.data)]))}

      <h2>Highlighted messages &amp; announcements <small>${highlighted.length}</small></h2>
      ${table([{label:'Time',t:1},{label:'Viewer'},{label:'Message'}], highlighted.map(e => [time(e.at), esc(whoIn(e.data)), `<span class="msg">${esc(textOf(e.data))}</span>`]))}

      <h2>Stream timeline <small>going live, scene changes, recording, connection</small></h2>
      ${table([{label:'Time',t:1},{label:'What'},{label:'Details'}], timeline.map(e => [time(e.at), esc(String(e.kind).replace('meld.','Meld ').replace(/_/g,' ')), summary(e.data)]))}

      <h2>Everyone who watched or chatted <small>${seen.size} people · grey = watched without chatting</small></h2>
      ${seen.size ? `<div class="names">${[...seen].sort((a,b) => a.localeCompare(b, undefined, {sensitivity:'base'})).map(n => `<span class="${chatNames.has(n) ? '' : 'lurk'}">${esc(n)}</span>`).join('')}</div>` : '<div class="none">None this night.</div>'}

      ${other.length ? `<h2>Other events <small>${other.length}</small></h2>
      ${table([{label:'Time',t:1},{label:'Event'},{label:'Who'},{label:'Details'}], other.map(e => [time(e.at), esc(e.kind), esc(whoIn(e.data)), summary(e.data)]))}` : ''}

      <div class="two">
        <div>
          <h2>Chat <small>${plural(Object.keys(chatters).length, 'chatter')}</small></h2>
          ${table([{label:'Viewer'},{label:'Messages',num:1},{label:'🦄 from chat',num:1}], chatterRows.map(([n, c]) => [esc(n), c.msgs, c.uni || '']))}
        </div>
        <div>
          <h2>Added by hand <small>${manual.length}</small></h2>
          ${table([{label:'Time',t:1},{label:'Viewer'},{label:'What'},{label:'🦄',num:1}],
            manual.map(e => [time(e.at), esc(e.username), `${e.amount} ${KIND[e.kind] || ''}${e.reason ? ' · ' + esc(e.reason) : ''}`, (e.unicorns > 0 ? '+' : '') + e.unicorns]))}
        </div>
      </div>

      <div class="long">
        <h2>Full chat log <small>${plural(rawChats.length, 'message')}</small></h2>
        ${table([{label:'Time',t:1},{label:'Viewer'},{label:'Message'}], rawChats.map(e => [time(e.at), esc(whoIn(e.data)), `<span class="msg">${esc(textOf(e.data)) || '<span style="color:#999">(no text)</span>'}</span>`]))}
        ${stt.length ? `<h2>Speech-to-text transcript <small>${stt.length} lines</small></h2>
        ${table([{label:'Time',t:1},{label:'Said'}], stt.map(e => [time(e.at), `<span class="msg">${esc(textOf(e.data)) || summary(e.data)}</span>`]))}` : ''}
      </div>

      <div class="foot">Rates: ${d.rates.chatWindow} per 10 min of chat · ${d.rates.subMonth} per sub month · ${d.rates.giftedSub} per gifted sub · 1 per ${d.rates.bitsPerUnicorn} bits.
        Chat messages are counted from ICB's listener; your own account and blocked bots aren't counted in chat. Printed ${new Date().toLocaleString()}.</div>`;
  }

  function downloadCsv(){
    if (!current) return;
    const rows = [['Date', 'Time', 'Event', 'Viewer', 'Details', 'Fluffy unicorns']];
    const T = { chat:'Chat message', follow:'Follow', sub:'Sub', gifts:'Gifted subs', bits:'Cheer', raid:'Raid', chat_unicorns:'Chat unicorns', manual:'Added by hand', winner:'Giveaway winner', reset:'Giveaway reset' };
    const RAW_DUP = new Set(['sub','gifts','follow','raid']); // already exported from the giveaway rows
    for (const e of current.events) {
      const d = new Date(e.at);
      if (e.type === 'chat') continue; // exported from the raw chat rows (those include the message text)
      if (e.type === 'raw') {
        if (RAW_DUP.has(e.kind)) continue;
        let det = '';
        if (e.kind === 'chat') {
          det = textOf(e.data);
          const dons = (e.data && Array.isArray(e.data.donations)) ? e.data.donations.filter(x => x && x.type) : [];
          if (dons.length) det += (det ? ' · ' : '') + dons.map(x => `${String(x.type).replace(/_/g,' ').toLowerCase()} ${x.amount ?? ''} ${x.currency || ''}`.trim()).join(', ');
          if (e.data && Array.isArray(e.data.attributes) && e.data.attributes.length) det += ` · [${e.data.attributes.join(', ')}]`;
        } else if (e.kind === 'viewer_list') {
          const list = (e.data && (e.data.viewers || e.data.users || e.data.list)) || [];
          det = `${Array.isArray(list) ? list.length : 0} viewers: ${(Array.isArray(list) ? list : []).map(nameOf).join(', ')}`;
        } else if (e.kind === 'viewer_count') {
          det = `${e.data && e.data.count} viewers`;
        } else {
          det = textOf(e.data) || summary(e.data, 20).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
        }
        rows.push([d.toLocaleDateString(), d.toLocaleTimeString(), e.kind === 'chat' ? 'Chat message' : e.kind, whoIn(e.data), det, '']);
        continue;
      }
      let details = '', uni = e.unicorns ?? '';
      if (e.type === 'sub') details = `${subKind(e)} · ${tier(e.tier)} · ${e.months || 1} month(s)`;
      else if (e.type === 'gifts') details = `${e.count} gifted · ${tier(e.tier)}${e.recipients && e.recipients.length ? ' · to ' + e.recipients.join(', ') : ''}`;
      else if (e.type === 'bits') details = `${e.amount} bits`;
      else if (e.type === 'raid') details = `${e.viewers} viewers`;
      else if (e.type === 'manual') details = `${e.amount} ${KIND[e.kind] || ''}${e.reason ? ' · ' + e.reason : ''}`;
      else if (e.type === 'winner') details = e.prize === 'mystery-outfit' ? 'Mystery Outfit' : 'Plushie';
      if (e.type === 'chat_unicorns') {
        for (const u of e.usernames) rows.push([d.toLocaleDateString(), d.toLocaleTimeString(), T[e.type], u, '10 min of chatting', e.each || 1]);
        continue;
      }
      if (e.blocked) details += (details ? ' · ' : '') + 'not in giveaway';
      rows.push([d.toLocaleDateString(), d.toLocaleTimeString(), T[e.type] || e.type, e.username || '', details, uni]);
    }
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
    a.download = `stream-report-${current.date}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  init();
</script>
</body>
</html>
