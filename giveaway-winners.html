<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ijustababyTV winners circle</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;
    font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;}
  #wrap{
    width:420px;
    border-radius:22px;
    padding:16px 18px 14px;
    background:linear-gradient(160deg, rgba(120,20,110,0.55), rgba(210,90,220,0.42));
    -webkit-backdrop-filter:blur(16px) saturate(170%);
    backdrop-filter:blur(16px) saturate(170%);
    border:2px solid rgba(255,215,150,0.6);
    box-shadow:0 0 0 1px rgba(255,180,90,0.3),
               0 8px 26px rgba(60,0,70,0.45),
               inset 0 1px 0 rgba(255,255,255,0.3);
  }
  #title{
    margin:0 0 10px;
    font-weight:800;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-size:19px;
    text-align:center;
    color:#fff6e8;
    text-shadow:0 0 10px rgba(255,255,255,0.85),0 0 20px rgba(255,200,110,0.9),0 2px 4px rgba(60,0,70,0.5);
  }
  #list{ display:flex; flex-direction:column; gap:6px; max-height:380px; overflow:hidden; }
  .row{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,225,180,0.4);
    border-radius:12px;
    padding:7px 12px;
  }
  .row.latest{
    background:rgba(255,215,110,0.28);
    border-color:rgba(255,215,110,0.8);
    box-shadow:0 0 14px rgba(255,215,110,0.5);
  }
  .medal{ font-size:18px; }
  .who{ flex:1; min-width:0; }
  .name{
    font-weight:800; font-size:14.5px; color:#fff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow:0 0 6px rgba(255,255,255,0.4);
  }
  .row.latest .name{ font-weight:900; }
  .prize{
    font-size:10.5px; font-weight:700; color:#ffe9c9; opacity:0.9; text-transform:uppercase; letter-spacing:0.03em;
  }
  #empty{
    text-align:center; color:#ffe9c9; font-size:13px; padding:14px 0; opacity:0.85;
  }
</style>
</head>
<body>
<div id="wrap">
  <p id="title">🏆 Winners Circle 🏆</p>
  <div id="list"></div>
  <div id="empty" style="display:none;">No winners drawn yet tonight!</div>
</div>
<script>
(function(){
  // Plain ES5, XHR poll - same rules as every other Meld overlay page.
  // Shows every winner drawn tonight, newest first, most recent highlighted.
  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');

  function prizeLabel(w){
    // A custom prize name set on the dashboard (e.g. "Squishmallow Corgi")
    // overrides the generic wording (Baby, 2026-09-26).
    if (w.prizeLabel) return w.prizeLabel;
    if (w.prize === 'mystery-outfit') return 'Mystery Outfit';
    if (w.prize === 'plushie') return 'Plushie';
    return w.prize;
  }
  function prizeMedal(prize){
    return prize === 'mystery-outfit' ? '🎁' : '🧸';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  var titleEl = document.getElementById('title');
  function applyDisplay(d){
    if (!d) { return; }
    if (typeof d.winnersTitle === 'string') { titleEl.textContent = d.winnersTitle; titleEl.style.display = d.winnersTitle ? '' : 'none'; }
    if (typeof d.winnersEmptyMessage === 'string') { emptyEl.textContent = d.winnersEmptyMessage; }
  }

  function render(giveaway){
    applyDisplay(giveaway.display);
    // Hide winners for the first few seconds so unicorn-jar.html can do the
    // big reveal before their name lands on this board.
    // unicorn-jar.html reveals the winner ~20 s before the draw song ends
    // (song is ~1:42, so the reveal lands ~82 s after the click). Baby 2026-09-26.
    var REVEAL_DELAY_MS = 83000;
    var nowMs = new Date().getTime();
    var all = giveaway.winners || [], visible = [];
    for (var v = 0; v < all.length; v++) {
      var at = Date.parse(all[v].at);
      if (isNaN(at) || nowMs - at >= REVEAL_DELAY_MS) visible.push(all[v]);
    }
    var winners = visible.reverse(); // newest first
    if (!winners.length) {
      listEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    var html = '';
    for (var i = 0; i < winners.length; i++) {
      var w = winners[i];
      html += '<div class="row' + (i === 0 ? ' latest' : '') + '">'
        + '<span class="medal">' + prizeMedal(w.prize) + '</span>'
        + '<span class="who"><span class="name">' + escapeHtml(w.username) + '</span><br>'
        + '<span class="prize">' + escapeHtml(prizeLabel(w)) + '</span></span>'
        + '</div>';
    }
    listEl.innerHTML = html;
  }

  function poll(){
    var x = new XMLHttpRequest();
    x.open('GET', '/api/giveaway/state?_=' + new Date().getTime(), true);
    x.onreadystatechange = function(){
      if (x.readyState !== 4) return;
      if (x.status !== 200) return;
      try {
        var d = JSON.parse(x.responseText);
        if (d && d.giveaway) { lastGiveaway = d.giveaway; render(d.giveaway); }
      } catch (e) {}
    };
    x.send();
  }

  var lastGiveaway = null;
  poll();
  setInterval(poll, 4000);
  // Re-check the reveal delay every second so a new winner appears right on time.
  setInterval(function(){ if (lastGiveaway) render(lastGiveaway); }, 1000);
})();
</script>
</body>
</html>
