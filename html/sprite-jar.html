<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ICB Sprite Jar</title>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Creepster&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/sprite-jar.css">
</head>
<body>
<div id="stage">
  <div id="jar">
    <img class="layer" id="jarBack" alt="">
    <div id="inner"></div>
    <img class="layer" id="jarFront" alt="">
    <div id="jarCount"></div>
  </div>
  <div id="floor"></div>
  <div id="book">
    <div id="flies"><i class="fly-dot" style="left:4%;top:70%"></i><i class="fly-dot" style="left:92%;top:40%;animation-delay:1.5s;-webkit-animation-delay:1.5s"></i><i class="fly-dot" style="left:20%;top:8%;animation-delay:3s;-webkit-animation-delay:3s"></i><i class="fly-dot" style="left:70%;top:4%;animation-delay:4.2s;-webkit-animation-delay:4.2s"></i><i class="fly-dot" style="left:97%;top:85%;animation-delay:2.2s;-webkit-animation-delay:2.2s"></i><i class="fly-dot" style="left:45%;top:-2%;animation-delay:5.5s;-webkit-animation-delay:5.5s"></i></div>
    <div class="cover">
      <div class="ribbon" id="ribbon">Sprite Sticker Book</div>
      <div class="pages">
        <div class="page l" id="pl"></div>
        <div class="page r" id="pr"><div id="prHead"></div><div class="slots" id="prVars"></div></div>
        <div class="caption" id="cap"></div>
      </div>
    </div>
  </div>
  <div id="shut"><div class="cv"><div class="spine"></div><div class="web"></div><div class="moon">☾</div><div class="ttl" id="shutTtl"></div><div class="sea" id="shutSea"></div><img class="ghost" id="shutImg" alt=""><div class="cnt" id="shutCnt"></div></div><div class="edge"></div></div>
  <div id="fly"></div>
</div>
<script src="/js/client/sprite-jar/physics.js"></script>
<script src="/js/client/sprite-jar/book.js"></script>
<script src="/js/client/sprite-jar/animation.js"></script>
<script src="/js/client/sprite-jar/stickers.js"></script>
<script src="/js/client/sprite-jar.js"></script>
</body>
</html>
