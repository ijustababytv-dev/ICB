<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ICB Team Hunt</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  /* Team Hunt overlay (Baby, 2026-10-19) - ICB build of her Meld "cloth-team-contest" look, any number of teams.
     Full-screen transparent Meld layer; everything is set from /hunt-control.html. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: 'Fredoka', 'Outfit', sans-serif; }
  #wrap { position: absolute; left: 50%; top: 50%; transition: opacity .5s; }
  #card { position: relative; overflow: hidden; border-radius: 1.5em; padding: .9em 1em 1em; color: #fff;
    background: rgba(12,10,9,.95); border: .12em solid rgba(168,85,247,.5); box-shadow: 0 1.2em 3em rgba(59,7,100,.6), 0 0 2em rgba(168,85,247,.25); }
  #card.pink { background: rgba(48,12,44,.94); border-color: rgba(255,143,216,.6); box-shadow: 0 1.2em 3em rgba(80,10,60,.6), 0 0 2em rgba(255,143,216,.3); }
  #card.palia { background: rgba(14,28,20,.94); border-color: rgba(251,191,36,.55); box-shadow: 0 1.2em 3em rgba(5,30,15,.6), 0 0 2em rgba(251,191,36,.25); }
  #card.clean { background: rgba(20,20,26,.92); border-color: rgba(255,255,255,.18); box-shadow: 0 1em 2.5em rgba(0,0,0,.6); }
  .glow { position: absolute; width: 10em; height: 10em; border-radius: 50%; pointer-events: none; opacity: .35; }
  .glow.a { left: -3em; top: -3em; } .glow.b { right: -3em; bottom: -3em; }
  .head { position: relative; padding-bottom: .5em; margin-bottom: .65em; border-bottom: .06em solid rgba(168,85,247,.35); }
  .head .ic { font-size: 1.5em; vertical-align: middle; margin-right: .3em; }
  .head .t { display: inline-block; vertical-align: middle; max-width: 70%; }
  .title { font-family: 'Outfit', sans-serif; font-size: .9em; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #d8b4fe; }
  .stitle { font-size: .66em; font-weight: 600; color: rgba(216,180,254,.75); margin-top: .1em; }
  .timer { position: absolute; right: 0; top: 0; text-align: right; }
  .timer .tm { display: inline-block; font-family: 'Outfit', monospace; font-weight: 900; font-size: 1.15em; color: #fcd34d; background: rgba(28,25,23,.9); border: .06em solid rgba(245,158,11,.45);
    padding: .1em .55em; border-radius: .6em; font-variant-numeric: tabular-nums; }
  .timer .st { display: block; font-size: .55em; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #34d399; margin-top: .15em; }
  .legend { margin: -.2em 0 .6em; font-size: .68em; font-weight: 600; color: rgba(233,213,255,.85); }
  .legend span { display: inline-block; margin: .15em .35em .15em 0; padding: .12em .55em; border-radius: 99em; background: rgba(255,255,255,.06); border: .06em solid rgba(255,255,255,.12); white-space: nowrap; }
  .legend b { color: #fcd34d; } .legend img { height: 1.3em; vertical-align: middle; margin-right: .2em; }
  .bar { position: relative; height: .7em; border-radius: 99em; overflow: hidden; background: rgba(28,25,23,.9); border: .06em solid rgba(88,28,135,.6); margin: 0 0 .7em; white-space: nowrap; font-size: 1em; }
  .bar i { display: inline-block; height: 100%; transition: width .6s; vertical-align: top; }
  .teams { text-align: center; font-size: 0; }
  .team { display: inline-block; vertical-align: top; text-align: left; font-size: 16px; padding: 0 .3em; margin-bottom: .55em; }
  .pill { position: relative; overflow: hidden; border-radius: 1em; padding: .5em .7em .5em .85em; margin-bottom: .45em; background: rgba(28,25,23,.85); border: .06em solid #888; }
  .pill .edge { position: absolute; left: 0; top: 0; bottom: 0; width: .22em; }
  .pill .nm { font-size: .68em; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .pill .mc { font-size: .62em; font-weight: 600; opacity: .7; }
  .pill .cmd { font-size: .58em; font-weight: 700; opacity: .55; }
  .pill .sc { position: absolute; right: .55em; top: 50%; margin-top: -.62em; font-family: 'Outfit', sans-serif; font-size: 1.85em; font-weight: 900; line-height: 1.25em; }
  .pill .crown { position: absolute; right: .35em; top: -.05em; font-size: .9em; display: none; }
  .team.lead .crown { display: block; }
  .roster { border-radius: .9em; padding: .4em .5em; background: rgba(28,25,23,.75); border: .06em solid #555; min-height: 2.6em; }
  .row { font-size: .72em; padding: .22em .3em; border-radius: .5em; white-space: nowrap; overflow: hidden; }
  .row + .row { margin-top: .12em; }
  .row .rk { display: inline-block; width: 1.5em; font-weight: 800; opacity: .55; }
  .row .pn { display: inline-block; max-width: 70%; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; font-weight: 600; }
  .row .pp { float: right; font-family: 'Outfit', sans-serif; font-weight: 900; }
  .row.hot { background: rgba(255,255,255,.12); }
  .row.more { opacity: .55; font-style: italic; text-align: center; }
  .empty { font-size: .64em; font-style: italic; opacity: .45; text-align: center; padding: .7em 0; white-space: normal; }
  .bump { -webkit-animation: bump .45s ease-out; animation: bump .45s ease-out; }
  @-webkit-keyframes bump { 50% { -webkit-transform: scale(1.18); } }
  @keyframes bump { 50% { transform: scale(1.18); filter: brightness(1.35); } }
  .tick { margin-top: .3em; padding-top: .45em; border-top: .06em solid rgba(88,28,135,.4); font-size: .64em; white-space: nowrap; overflow: hidden; }
  .tick .live { display: inline-block; width: .5em; height: .5em; border-radius: 50%; background: #34d399; margin-right: .4em; vertical-align: middle; -webkit-animation: ping 1.4s infinite; animation: ping 1.4s infinite; }
  @-webkit-keyframes ping { 50% { opacity: .3; } } @keyframes ping { 50% { opacity: .3; } }
  .tick .lbl { color: rgba(216,180,254,.7); font-weight: 600; margin-right: .6em; }
  .tick .msg { color: #fcd34d; font-weight: 700; }
  #win { display: none; margin: -.2em 0 .6em; text-align: center; padding: .45em .6em; border-radius: 1em; background: linear-gradient(90deg, rgba(245,158,11,.25), rgba(217,70,239,.25)); border: .06em solid rgba(252,211,77,.6); }
  #win .w { font-family: 'Outfit', sans-serif; font-size: 1.35em; font-weight: 900; color: #fde68a; text-shadow: 0 0 .5em rgba(252,211,77,.7); -webkit-animation: pop 1.1s ease-in-out infinite alternate; animation: pop 1.1s ease-in-out infinite alternate; }
  @-webkit-keyframes pop { to { -webkit-transform: scale(1.05); } } @keyframes pop { to { transform: scale(1.05); } }
  .spark { position: absolute; z-index: 5; pointer-events: none; font-size: 1.1em; transition: all 1.3s ease-out; }
</style>
</head>
<body>
<div id="wrap"><div id="card">
  <div class="glow a"></div><div class="glow b"></div>
  <div class="head"><span class="ic" id="ic">🎃</span><div class="t"><div class="title" id="title"></div><div class="stitle" id="stitle"></div></div>
    <div class="timer" id="timer"><span class="tm" id="tm">60:00</span><span class="st" id="st"></span></div></div>
  <div id="win"><div class="w" id="winTxt"></div></div>
  <div class="legend" id="legend"></div>
  <div class="bar" id="bar"></div>
  <div class="teams" id="teams"></div>
  <div class="tick" id="tick"><span class="live"></span><span class="lbl">Live chat contest</span><span class="msg" id="msg"></span></div>
</div></div>
<script>
(function () {
  var D = null, off = 0, lastTotals = {}, lastLog = 0, lastHot = {}, epoch = null, sparked = false;
  function $(x) { return document.getElementById(x); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function rgba(h, a) { var n = parseInt(String(h).slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function fit() {
    if (!D) return; var W = window.innerWidth, H = window.innerHeight; if (!W || !H) return;
    var L = D.look, w = $('wrap'), cw = W * L.width / 100 * L.scale / 100;
    $('card').style.width = cw + 'px'; $('card').style.fontSize = (cw / 30) + 'px';
    w.style.left = (W * L.x / 100) + 'px'; w.style.top = (H * L.y / 100) + 'px';
    w.style.transform = w.style.webkitTransform = 'translate(-50%,-50%)';
    var tms = $('teams').children, n = D.board.length, per = n <= 4 ? n : n <= 6 ? 3 : 4;
    for (var i = 0; i < tms.length; i++) { tms[i].style.width = (100 / Math.max(1, per)) + '%'; tms[i].style.fontSize = (cw / 30) + 'px'; }
  }
  window.onresize = fit;
  function msgFor(e) {
    if (!e) return 'Type !team ' + (D.teams[0] ? D.teams[0].key.toUpperCase() : 'A') + ' to join a team!';
    if (e.kind === 'join') return e.name + ' joined ' + teamName(e.team) + '!';
    if (e.kind === 'find') return e.name + ' found ' + (e.n > 1 ? e.n + ' ' : e.n < 0 ? '(' + e.n + ') ' : '') + (e.icon ? e.icon + ' ' : '') + (e.label || e.item) + ' · ' + (e.pts > 0 ? '+' : '') + e.pts + ' pts';
    if (e.kind === 'noteam') return e.name + ' isn\'t on a team yet - type !team ' + (D.teams[0] ? D.teams[0].key.toUpperCase() : 'A') + ' first!';
    if (e.kind === 'move') return e.name + ' moved to ' + teamName(e.team);
    if (e.kind === 'start') return 'The hunt is ON! Good luck!';
    if (e.kind === 'end') return 'Time\'s up!';
    return '';
  }
  function teamName(k) { for (var i = 0; i < D.teams.length; i++) if (D.teams[i].key === k) return D.teams[i].name; return 'Team ' + String(k).toUpperCase(); }
  var rkey = '';
  function render() {
    var lastE = D.recent[D.recent.length - 1], k = JSON.stringify([D.board, D.items, D.look, D.title, D.subtitle, D.visible, D.teams, lastE ? lastE.id : 0]);
    if (k === rkey) { fit(); return; } rkey = k;
    var L = D.look, card = $('card');
    $('wrap').style.opacity = D.visible ? 1 : 0;
    card.className = L.theme === 'spooky' ? '' : L.theme;
    var t0 = D.board[0], t1 = D.board[1];
    card.children[0].style.background = 'radial-gradient(circle, ' + (t0 ? t0.color : '#06b6d4') + ' 0%, transparent 70%)';
    card.children[1].style.background = 'radial-gradient(circle, ' + (t1 ? t1.color : '#d946ef') + ' 0%, transparent 70%)';
    $('ic').textContent = D.items[0] && D.items[0].icon ? D.items[0].icon : '🎃';
    $('title').textContent = D.title; $('stitle').textContent = D.subtitle; $('stitle').style.display = D.subtitle ? '' : 'none';
    $('timer').style.display = L.showTimer ? '' : 'none';
    // legend: !team keys + what each find is worth
    var lg = '';
    for (var i = 0; i < D.items.length; i++) { var it = D.items[i]; lg += '<span>' + (it.imageUrl ? '<img src="' + esc(it.imageUrl) + '" alt="">' : esc(it.icon || '')) + ' !' + esc(it.command) + ' = <b>' + it.pts + ' pts</b></span>'; }
    $('legend').innerHTML = lg; $('legend').style.display = L.showLegend && lg ? '' : 'none';
    // tug bar
    var sum = 0, b; for (i = 0; i < D.board.length; i++) sum += Math.max(0, D.board[i].total);
    var bh = ''; for (i = 0; i < D.board.length; i++) { b = D.board[i]; bh += '<i style="width:' + (sum ? Math.max(0, b.total) / sum * 100 : 100 / D.board.length) + '%;background:linear-gradient(90deg,' + rgba(b.color, .75) + ',' + b.color + ')"></i>'; }
    $('bar').innerHTML = bh; $('bar').style.display = L.showBar ? '' : 'none';
    // teams
    var hot = {}, last = D.recent[D.recent.length - 1];
    if (last && last.id > lastLog && last.kind === 'find') hot[(last.name || '').toLowerCase()] = 1;
    var h = '';
    for (i = 0; i < D.board.length; i++) {
      b = D.board[i];
      var tc = b.color, tg = rgba(b.color, .55);
      h += '<div class="team' + (b.leading ? ' lead' : '') + '"><div class="pill" style="border-color:' + rgba(tc, .45) + (b.leading ? ';box-shadow:0 0 1em ' + tg : '') + '"><span class="edge" style="background:' + tc + '"></span><span class="crown">👑</span><div class="nm" style="color:' + tc + '">' + esc(b.name) + '</div>' +
        '<div class="mc">' + b.players.length + ' member' + (b.players.length === 1 ? '' : 's') + ' · <span class="cmd">!team ' + esc(b.key.toUpperCase()) + '</span></div>' +
        '<div class="sc" data-k="' + esc(b.key) + '" style="color:' + tc + ';text-shadow:0 0 .4em ' + tg + '">' + b.total + '</div></div>';
      if (L.showPlayers > 0) {
        h += '<div class="roster" style="border-color:' + rgba(tc, .3) + '">';
        if (!b.players.length) h += '<div class="empty">No one yet - type <b>!team ' + esc(b.key.toUpperCase()) + '</b></div>';
        var shown = b.players.slice(0, L.showPlayers);
        for (var j = 0; j < shown.length; j++) h += '<div class="row' + (hot[shown[j].name.toLowerCase()] ? ' hot' : '') + '"><span class="rk">' + (j + 1) + '</span><span class="pn">' + esc(shown[j].name) + '</span><span class="pp" style="color:' + tc + '">' + shown[j].points + '</span></div>';
        if (b.players.length > shown.length) h += '<div class="row more">+' + (b.players.length - shown.length) + ' more</div>';
        h += '</div>';
      }
      h += '</div>';
    }
    $('teams').innerHTML = h;
    for (i = 0; i < D.board.length; i++) { b = D.board[i]; if (lastTotals[b.key] !== undefined && lastTotals[b.key] !== b.total) { var el = document.querySelector('.sc[data-k="' + b.key + '"]'); if (el) { el.className = 'sc bump'; } } lastTotals[b.key] = b.total; }
    if (last) lastLog = last.id;
    $('msg').textContent = msgFor(last);
    $('tick').style.display = L.showTicker ? '' : 'none';
    fit();
  }
  function winner() {
    var max = -1, w = [];
    for (var i = 0; i < D.board.length; i++) { var b = D.board[i]; if (b.total > max) { max = b.total; w = [b]; } else if (b.total === max) w.push(b); }
    if (max <= 0) return 'Time\'s up!';
    if (w.length > 1) return '🤝 It\'s a tie! ' + w.map(function (x) { return x.name; }).join(' & ');
    return '🏆 ' + w[0].name + ' wins with ' + max + ' pts!';
  }
  function sparkle() {
    var card = $('card'), cw = card.offsetWidth, chh = card.offsetHeight, ch = ['✦', '★', '✨', '🎃', '♥'];
    for (var i = 0; i < 26; i++) (function (i) {
      var e = document.createElement('span'); e.className = 'spark'; e.textContent = ch[i % ch.length]; e.style.left = cw / 2 + 'px'; e.style.top = chh * .25 + 'px'; e.style.color = '#fde68a';
      card.appendChild(e);
      setTimeout(function () { var a = Math.random() * Math.PI * 2, d = cw * (.2 + Math.random() * .4); e.style.left = (cw / 2 + Math.cos(a) * d) + 'px'; e.style.top = (chh * .25 + Math.sin(a) * d * .5) + 'px'; e.style.opacity = '0'; }, 30);
      setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 1500);
    })(i);
  }
  function tick() {
    if (!D) return;
    var T = D.timer, now = Date.now() + off, left = T.status === 'running' ? Math.max(0, T.endsAt - now) : T.left, st = T.status;
    if (st === 'running' && left <= 0) st = 'ended';
    var s = Math.ceil(left / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    $('tm').textContent = st === 'ended' ? '00:00' : (h ? h + ':' + two(m) : two(m)) + ':' + two(s % 60);
    var stx = st === 'running' ? (D.scoring ? 'Hunting!' : 'Paused scoring') : st === 'paused' ? 'Paused' : st === 'ended' ? 'Finished' : (D.joinOpen ? 'Join now!' : 'Ready');
    $('st').textContent = stx; $('st').style.color = st === 'running' ? '#34d399' : st === 'ended' ? '#f472b6' : '#fcd34d';
    var ended = st === 'ended';
    $('win').style.display = ended ? 'block' : 'none';
    if (ended) { $('winTxt').textContent = winner(); if (!sparked) { sparked = true; sparkle(); setTimeout(sparkle, 700); } } else sparked = false;
  }
  function poll() {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/hunt?t=' + Date.now(), true); x.timeout = 4000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status === 200) { try { D = JSON.parse(x.responseText); off = D.now - Date.now(); if (epoch !== null && epoch !== D.epoch) lastTotals = {}; epoch = D.epoch; render(); tick(); } catch (e) {} }
      setTimeout(poll, 1000);
    };
    x.send();
  }
  setInterval(tick, 250);
  poll();
})();
</script>
</body>
</html>
