<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICB Clean Overlay</title>
  <style>html,body{margin:0;background:transparent;color:#fff;font:700 24px/1.2 system-ui,Segoe UI,sans-serif}main{width:max-content;min-width:440px;padding:18px 22px;border:1px solid rgba(160,220,255,.28);border-radius:18px;background:linear-gradient(135deg,rgba(8,17,31,.9),rgba(25,42,72,.8));box-shadow:0 0 30px rgba(80,190,255,.12)}.eyebrow{color:#8eefff;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.title{font-size:15px;color:#b8c8df;margin:5px 0 13px}.resources{display:flex;gap:22px}.resource{display:grid;gap:2px}.label{font-size:10px;color:#9aafca;text-transform:uppercase;letter-spacing:.1em}.value{font-size:30px;color:#f4f7ff}.offline{color:#ffabb6;font-size:11px;margin-top:10px}</style>
</head>
<body><main><div class="eyebrow">ICB clean // live trackers</div><div class="title" id="title">Waiting for command center…</div><div class="resources"><div class="resource"><div class="label">Amber</div><div class="value" id="amber">0</div></div><div class="resource"><div class="label">Essence</div><div class="value" id="essence">0</div></div><div class="resource"><div class="label">Sweet Leaf</div><div class="value" id="sweetLeaf">0</div></div></div><div class="offline" id="status">READER OFFLINE</div></main>
<script>const $=id=>document.getElementById(id);const fmt=v=>v===null||v===undefined?'—':Number(v).toLocaleString();function render(p){const l=p.live||p;const needs=Boolean(l.reconciliation?.required);$('amber').textContent=fmt(l.resources?.amber);$('essence').textContent=fmt(l.resources?.essence);$('sweetLeaf').textContent=fmt(l.resources?.sweetLeaf);$('title').textContent=needs?'Palia totals need reconciliation':p.settings?.stream?.title||'Live Palia trackers';$('status').textContent=needs?'ENTER CURRENT TOTALS IN CHROME':(l.reader?.state||'offline').toUpperCase()+' // '+(l.session?.mode||'offline').toUpperCase();}fetch('/api/state',{cache:'no-store'}).then(r=>r.json()).then(render);const e=new EventSource('/events?role=overlay');e.addEventListener('snapshot',x=>render(JSON.parse(x.data)));e.addEventListener('live',x=>{const l=JSON.parse(x.data);fetch('/api/settings',{cache:'no-store'}).then(r=>r.json()).then(s=>render({live:l,settings:s.settings}));});e.addEventListener('settings',x=>{const s=JSON.parse(x.data);fetch('/api/live',{cache:'no-store'}).then(r=>r.json()).then(l=>render({live:l.live,settings:s}));});</script>
</body></html>
