<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ICB Palia Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* Palia clock (Baby, 2026-10-19). Full-screen transparent Meld layer. Palia time is worked out here
     from the real clock (1 Palia day = 1 real hour, 6:00 AM at :15 UTC) - same as palia-time-notifier. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: 'Fredoka', sans-serif; }
  #wrap { position: absolute; left: 0; top: 0; transition: opacity .5s; }
  #card { position: relative; overflow: hidden; width: 18.5em; padding: .8em 1em .85em; border-radius: 1.3em; color: #fff;
    background: linear-gradient(160deg, rgba(30,27,75,.95), rgba(15,12,40,.96)); border: .1em solid rgba(165,180,252,.45); box-shadow: 0 .8em 2em rgba(0,0,0,.6), 0 0 1.5em rgba(129,140,248,.3); }
  #card.palia { background: linear-gradient(160deg, rgba(20,48,32,.95), rgba(10,26,18,.96)); border-color: rgba(251,191,36,.5); box-shadow: 0 .8em 2em rgba(0,0,0,.6), 0 0 1.5em rgba(251,191,36,.25); }
  #card.pink { background: linear-gradient(160deg, rgba(80,20,70,.94), rgba(40,10,40,.96)); border-color: rgba(255,143,216,.6); box-shadow: 0 .8em 2em rgba(0,0,0,.6), 0 0 1.5em rgba(255,143,216,.35); }
  #card.glass { background: rgba(15,23,42,.45); border-color: rgba(255,255,255,.3); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .top { position: relative; height: 3.4em; }
  #sky { position: absolute; left: 0; top: 0; width: 3.4em; height: 3.4em; border-radius: 1em; overflow: hidden; transition: background 2s; }
  #orb { position: absolute; left: 50%; top: 50%; width: 2.3em; height: 2.3em; margin: -1.15em 0 0 -1.15em; font-size: 1em; text-align: center; line-height: 2.3em; }
  #orb span { font-size: 1.9em; }
  .tt { position: absolute; left: 4.1em; top: 0; right: 0; }
  .lbl { font-size: .62em; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #c7d2fe; opacity: .9; }
  #card.palia .lbl { color: #fde68a; } #card.pink .lbl { color: #fbcfe8; }
  #time { font-family: 'Outfit', sans-serif; font-size: 2.2em; font-weight: 900; line-height: 1.05; letter-spacing: .01em; font-variant-numeric: tabular-nums; text-shadow: 0 0 .4em rgba(165,180,252,.6); white-space: nowrap; }
  #time small { font-size: .45em; font-weight: 700; margin-left: .2em; opacity: .85; }
  #real { font-size: .58em; opacity: .65; margin-top: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { position: relative; height: .5em; margin: .7em 0 .1em; border-radius: 99em; background: linear-gradient(90deg, #1e1b4b 0%, #312e81 20%, #f59e0b 26%, #7dd3fc 40%, #7dd3fc 65%, #f97316 75%, #312e81 82%, #1e1b4b 100%); opacity: .9; }
  #pin { position: absolute; top: 50%; width: .95em; height: .95em; margin: -.475em 0 0 -.475em; border-radius: 50%; background: #fff; box-shadow: 0 0 .5em #fff; }
  .ticks { position: relative; height: .9em; font-size: .5em; opacity: .55; }
  .ticks span { position: absolute; top: .2em; margin-left: -1.2em; width: 2.4em; text-align: center; }
  #next { margin-top: .5em; font-size: .7em; padding: .35em .6em; border-radius: .7em; background: rgba(255,255,255,.07); border: .07em solid rgba(255,255,255,.12); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next b { color: #fcd34d; }
  #ring { display: none; margin-top: .55em; padding: .5em .6em; border-radius: .8em; text-align: center; background: linear-gradient(90deg, rgba(251,191,36,.25), rgba(244,114,182,.25)); border: .08em solid rgba(252,211,77,.7);
    -webkit-animation: ring 1s ease-in-out infinite alternate; animation: ring 1s ease-in-out infinite alternate; }
  #ring .rt { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1.05em; color: #fde68a; text-shadow: 0 0 .5em rgba(252,211,77,.7); }
  #ring .rs { font-size: .65em; opacity: .85; margin-top: .1em; }
  @-webkit-keyframes ring { to { -webkit-transform: scale(1.04); } } @keyframes ring { to { transform: scale(1.04); box-shadow: 0 0 1.2em rgba(252,211,77,.5); } }
  .bell { display: inline-block; -webkit-animation: bell .5s ease-in-out infinite alternate; animation: bell .5s ease-in-out infinite alternate; }
  @-webkit-keyframes bell { from { -webkit-transform: rotate(-18deg); } to { -webkit-transform: rotate(18deg); } } @keyframes bell { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
</style>
</head>
<body>
<div id="wrap"><div id="card">
  <div class="top"><div id="sky"><div id="orb"><span id="orbI">☀️</span></div></div>
    <div class="tt"><div class="lbl" id="title">Palia Time</div><div id="time">6:00<small>AM</small></div><div id="real"></div></div></div>
  <div id="bar"><div id="pin"></div></div>
  <div class="ticks"><span style="left:0%">12a</span><span style="left:25%">6a</span><span style="left:50%">12p</span><span style="left:75%">6p</span><span style="left:100%">12a</span></div>
  <div id="next"></div>
  <div id="ring"><div class="rt" id="ringT"></div><div class="rs" id="ringS"></div></div>
</div></div>
<script>
(function () {
  var D = null, off = 0, last = null, prevH = null, ringUntil = 0, started = false;
  function $(x) { return document.getElementById(x); }
  function paliaHours(ms) { var d = new Date(ms), m = d.getUTCMinutes() + d.getUTCSeconds() / 60 + d.getUTCMilliseconds() / 60000; return (((6 + (m - 15) / 2.5) % 24) + 24) % 24; }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(h, m, t24) { if (t24) return two(h) + ':' + two(m); var hh = h % 12 === 0 ? 12 : h % 12; return hh + ':' + two(m) + ' ' + (h < 12 ? 'AM' : 'PM'); }
  function tval(t) { var p = t.split(':'); return Number(p[0]) + Number(p[1]) / 60; }
  function fit() {
    if (!D) return; var W = window.innerWidth, H = window.innerHeight; if (!W || !H) return;
    var L = D.look, w = $('wrap');
    $('card').style.fontSize = (16 * H / 1080 * L.scale / 100) + 'px';
    var cw = w.offsetWidth, ch = w.offsetHeight;
    var x = W * L.x / 100 - cw / 2, y = H * L.y / 100 - ch / 2;
    x = Math.max(8, Math.min(W - cw - 8, x)); y = Math.max(8, Math.min(H - ch - 8, y));
    w.style.left = x + 'px'; w.style.top = y + 'px';
  }
  window.onresize = fit;
  var actx = null;
  function chime() {
    if (!D || !D.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var notes = [784, 988, 1175, 1568], v = (D.volume || 60) / 100 * .25;
      for (var i = 0; i < notes.length; i++) (function (f, t) {
        var o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, actx.currentTime + t); g.gain.linearRampToValueAtTime(v, actx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + t + .9);
        o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 1);
      })(notes[i], i * .16);
    } catch (e) {}
  }
  function ring(icon, label, time) {
    $('ringT').innerHTML = '<span class="bell">' + (icon || '🔔') + '</span> ' + (time ? time + ' — ' : '') ;
    $('ringT').appendChild(document.createTextNode(label || ''));
    $('ringS').textContent = 'Palia time alarm';
    ringUntil = Date.now() + (D.bannerSec || 8) * 1000; chime();
  }
  function tick() {
    if (!D) return;
    var L = D.look, now = Date.now() + off, ph = paliaHours(now), h = Math.floor(ph), m = Math.floor((ph % 1) * 60);
    $('wrap').style.opacity = D.visible ? 1 : 0;
    $('card').className = L.theme === 'night' ? '' : L.theme;
    $('title').textContent = D.title || 'Palia Time';
    var t = fmt(h, m, L.show24h), sp = t.indexOf(' ');
    $('time').innerHTML = sp > 0 ? t.slice(0, sp) + '<small>' + t.slice(sp + 1) + '</small>' : t;
    var rd = new Date(now);
    $('real').textContent = 'Real time ' + rd.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' · new Palia day in ' + Math.ceil(((24 - ph + 6) % 24 || 24) * 2.5) + ' min';
    $('real').style.display = L.showReal ? '' : 'none';
    var day = ph >= 6 && ph < 18;
    $('orbI').textContent = day ? '☀️' : '🌙';
    $('sky').style.background = day ? (ph < 8 || ph >= 16 ? 'linear-gradient(180deg,#fb923c,#fde68a)' : 'linear-gradient(180deg,#38bdf8,#bae6fd)') : 'linear-gradient(180deg,#0f172a,#4338ca)';
    $('pin').style.left = (ph / 24 * 100) + '%';
    $('bar').style.display = $('pin').style.display = L.showDayBar ? '' : 'none';
    document.querySelector('.ticks').style.display = L.showDayBar ? '' : 'none';
    // next alarm
    var best = null, bestDh = 99;
    for (var i = 0; i < D.alarms.length; i++) { var a = D.alarms[i]; if (!a.on) continue; var dh = (tval(a.time) - ph + 24) % 24; if (dh < bestDh) { bestDh = dh; best = a; } }
    if (best && L.showNext) {
      var secs = Math.ceil(bestDh * 150), tp = best.time.split(':');
      $('next').innerHTML = (best.icon || '⏰') + ' <span></span> · <b>' + fmt(Number(tp[0]), Number(tp[1]), L.show24h) + '</b> · in ' + Math.floor(secs / 60) + ':' + two(secs % 60);
      $('next').children[0].textContent = best.label || 'Alarm';
      $('next').style.display = '';
    } else $('next').style.display = 'none';
    // alarms that the clock just passed
    if (prevH !== null) {
      for (i = 0; i < D.alarms.length; i++) {
        a = D.alarms[i]; if (!a.on) continue; var tv = tval(a.time), passed = prevH <= ph ? (tv > prevH && tv <= ph) : (tv > prevH || tv <= ph);
        if (passed && (ph - prevH + 24) % 24 < 1) { var p2 = a.time.split(':'); ring(a.icon, a.label, fmt(Number(p2[0]), Number(p2[1]), L.show24h)); }
      }
    }
    prevH = ph;
    $('ring').style.display = Date.now() < ringUntil ? 'block' : 'none';
    fit();
  }
  function poll() {
    var x = new XMLHttpRequest();
    x.open('GET', '/api/paliaclock?since=' + (started ? last : 999999999) + '&t=' + Date.now(), true); x.timeout = 4000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status === 200) { try { var d = JSON.parse(x.responseText); D = d; off = d.now - Date.now();
        if (!started) { last = d.last; started = true; } else { for (var i = 0; i < d.events.length; i++) if (d.events[i].id > last) { last = d.events[i].id; ring(d.events[i].icon, d.events[i].label, ''); } if (d.last < last) last = d.last; }
        tick(); } catch (e) {} }
      setTimeout(poll, 1500);
    };
    x.send();
  }
  setInterval(tick, 250);
  poll();
})();
</script>
</body>
</html>
