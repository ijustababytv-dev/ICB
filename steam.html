<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ICB Steam Achievements</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Baloo 2", "Comic Sans MS", "Trebuchet MS", sans-serif; color: #fff; }
  #stage { position: absolute; left: 0; top: 0; width: 1000px; transform-origin: 0 0; }
  /* --- pop-up --- */
  #popWrap { height: 220px; position: relative; }
  .pop { position: absolute; left: 50%; top: 20px; width: 860px; margin-left: -430px; display: flex; align-items: center; background: linear-gradient(90deg, rgba(40,16,60,.95), rgba(90,30,110,.95));
    border: 4px solid #ffe66d; border-radius: 28px; padding: 18px 26px; box-sizing: border-box; box-shadow: 0 0 40px rgba(255,230,109,.55), 0 8px 0 rgba(0,0,0,.35);
    opacity: 0; -webkit-transform: translateY(-60px) scale(.9); transform: translateY(-60px) scale(.9); transition: opacity .45s, transform .45s cubic-bezier(.2,1.4,.4,1); }
  .pop.show { opacity: 1; -webkit-transform: none; transform: none; }
  .pop img { width: 128px; height: 128px; border-radius: 18px; border: 3px solid rgba(255,255,255,.85); margin-right: 22px; flex: none; background: rgba(0,0,0,.3); }
  .pop .txt { flex: 1; min-width: 0; }
  .pop .kicker { font-size: 24px; font-weight: 900; color: #ffe66d; letter-spacing: 1px; text-shadow: 0 2px 0 #000; }
  .pop .nm { font-size: 44px; font-weight: 900; line-height: 1.05; text-shadow: 0 3px 0 #3a1446; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pop .ds { font-size: 22px; font-weight: 700; color: #f1defa; margin-top: 2px; }
  .pop .rar { display: inline-block; margin-top: 6px; font-size: 18px; font-weight: 900; padding: 2px 12px; border-radius: 999px; background: rgba(0,0,0,.35); color: #9fe8ff; }
  .pop .rar.rare { color: #ffb3ff; }
  .spark { position: absolute; font-size: 30px; pointer-events: none; animation: spark 1.6s ease-out forwards; }
  @keyframes spark { from { opacity: 1; transform: translate(0,0) scale(.6); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3); } }
  /* --- progress --- */
  #prog { margin: 10px auto 0; width: 860px; background: rgba(28,14,40,.86); border: 4px solid rgba(255,255,255,.85); border-radius: 24px; padding: 14px 22px; box-sizing: border-box; box-shadow: 0 8px 0 rgba(58,20,70,.45); }
  #prog .top { display: flex; align-items: baseline; }
  #prog .ttl { flex: 1; font-size: 32px; font-weight: 900; text-shadow: 0 3px 0 #3a1446; }
  #prog .cnt { font-size: 34px; font-weight: 900; color: #ffe66d; }
  #prog .bar { height: 26px; border-radius: 999px; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.5); overflow: hidden; margin: 8px 0 10px; }
  #prog .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #b77cff, #ff8fd8, #ffe66d); transition: width .8s; }
  #prog .row { display: flex; align-items: center; }
  #prog .lbl { font-size: 18px; font-weight: 800; opacity: .8; margin-right: 10px; }
  #prog .ic { width: 52px; height: 52px; border-radius: 10px; border: 2px solid rgba(255,255,255,.7); margin-right: 8px; background: rgba(0,0,0,.3); }
  #prog .stats { display: flex; flex-wrap: wrap; margin-top: 8px; }
  #prog .st { background: rgba(255,255,255,.1); border-radius: 14px; padding: 4px 14px; margin: 4px 8px 0 0; font-size: 20px; font-weight: 800; }
  #prog .st b { color: #ffe66d; }
  #card { position: relative; width: 900px; margin: 10px auto 0; }
  #card img { width: 100%; display: block; }
  #card .val { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 900; text-shadow: 0 3px 0 #000, 0 0 12px rgba(0,0,0,.6); white-space: nowrap; }
  .hide { display: none !important; }
  #msg { margin: 20px auto; width: 700px; text-align: center; font-size: 22px; font-weight: 800; background: rgba(28,14,40,.8); border-radius: 18px; padding: 10px; }
</style>
</head>
<body>
<div id="stage">
  <div id="popWrap"><div class="pop" id="pop"><img id="pImg" alt=""><div class="txt"><div class="kicker">🏅 ACHIEVEMENT UNLOCKED!</div><div class="nm" id="pName"></div><div class="ds" id="pDesc"></div><span class="rar" id="pRar"></span></div></div></div>
  <div id="prog" class="hide">
    <div class="top"><div class="ttl" id="gTitle"></div><div class="cnt" id="gCount"></div></div>
    <div class="bar"><i id="gBar"></i></div>
    <div class="row" id="gRecent"></div>
    <div class="stats" id="gStats"></div>
  </div>
  <div id="card" class="hide"><img id="cImg" alt=""><div class="val" id="cVal"></div></div>
  <div id="msg" class="hide"></div>
</div>
<script>
// ICB Steam achievements overlay (Baby, 2026-10-07). Meld layers:
//   /steam.html?view=popup     - only the "Achievement Unlocked!" pop-up
//   /steam.html?view=progress  - the X / 64 progress card
//   /steam.html?view=both      - both stacked
//   /steam.html?view=card      - her own art card with X / 64 in its box (+ pop-ups: view=cardpop)
// Plain ES5 (Meld rule). Polls /api/steam every 2 s.
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var view = (/[?&]view=(\w+)/.exec(location.search) || [])[1] || 'popup';
  var showPop = view === 'popup' || view === 'both' || view === 'cardpop', showProg = view === 'progress' || view === 'both', showCard = view === 'card' || view === 'cardpop';
  if (!showPop) $('popWrap').className = 'hide';
  var stage = $('stage'), lastId = null, queue = [], busy = false, popSec = 9, showRarity = true;
  function fit(){
    stage.style.transform = 'none';
    var w = window.innerWidth || document.documentElement.clientWidth || 1000, h = window.innerHeight || document.documentElement.clientHeight || 400;
    var bw = 1000, bh = stage.offsetHeight || 1;
    var s = Math.min(w / bw, h / bh); if (!(s > 0)) s = 1;
    stage.style.transform = 'scale(' + s + ')'; stage.style.webkitTransform = 'scale(' + s + ')';
    stage.style.left = Math.max(0, (w - bw * s) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }

  function sparkle(){
    var bits = ['✨','⭐','💖','🌟','🦄'], pop = $('pop');
    for (var i = 0; i < 18; i++) {
      var s = document.createElement('div'); s.className = 'spark';
      s.appendChild(document.createTextNode(bits[i % bits.length]));
      s.style.left = (430 + (Math.random() * 600 - 300)) + 'px'; s.style.top = (90 + Math.random() * 60) + 'px';
      s.style.setProperty('--dx', Math.round(Math.random() * 300 - 150) + 'px'); s.style.setProperty('--dy', Math.round(-60 - Math.random() * 120) + 'px');
      $('popWrap').appendChild(s);
      (function(el){ setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1700); })(s);
    }
  }
  function next(){
    if (busy || !queue.length) return;
    busy = true; var a = queue.shift();
    $('pImg').src = a.icon || ''; $('pImg').style.display = a.icon ? '' : 'none';
    $('pName').textContent = a.name; $('pDesc').textContent = a.desc || '';
    var r = $('pRar');
    if (showRarity && a.rarity !== null && a.rarity !== undefined) { r.style.display = ''; r.className = 'rar' + (a.rarity < 10 ? ' rare' : ''); r.textContent = (a.rarity < 10 ? '💎 Rare! ' : '') + 'Only ' + a.rarity + '% of players have this'; }
    else r.style.display = 'none';
    $('pop').className = 'pop show'; sparkle();
    setTimeout(function(){ $('pop').className = 'pop'; setTimeout(function(){ busy = false; next(); }, 700); }, popSec * 1000);
  }

  function render(d){
    popSec = d.popupSec || 9; showRarity = d.showRarity !== false;
    // pop-ups: on first load, skip everything already there
    var i, maxId = 0;
    for (i = 0; i < d.popups.length; i++) maxId = Math.max(maxId, d.popups[i].id);
    if (lastId === null) lastId = maxId;
    for (i = 0; i < d.popups.length; i++) if (d.popups[i].id > lastId) queue.push(d.popups[i]);
    lastId = Math.max(lastId, maxId);
    if (showPop) next();
    // progress
    var msg = $('msg');
    if (showProg) {
      if (!d.configured || !d.total) { $('prog').className = 'hide'; msg.className = ''; msg.textContent = d.configured ? 'Connecting to Steam…' : 'Set up Steam on the ICB dashboard'; }
      else {
        msg.className = 'hide'; $('prog').className = '';
        $('gTitle').textContent = d.title || (d.gameName + ' Achievements');
        $('gCount').textContent = d.unlocked + ' / ' + d.total;
        $('gBar').style.width = Math.round(d.unlocked / d.total * 100) + '%';
        var h = '';
        if (d.recent.length) { h += '<span class="lbl">Latest:</span>'; for (i = 0; i < d.recent.length && i < 6; i++) if (d.recent[i].icon) h += '<img class="ic" src="' + esc(d.recent[i].icon) + '" title="' + esc(d.recent[i].name) + '" alt="">'; }
        $('gRecent').innerHTML = h;
        var sh = ''; for (i = 0; i < d.stats.length; i++) sh += '<span class="st">' + esc(d.stats[i].label) + ': <b>' + esc(d.stats[i].value) + '</b></span>';
        $('gStats').innerHTML = sh;
      }
    }
    if (showCard) {
      if (!d.card || !d.total) { $('card').className = 'hide'; msg.className = ''; msg.textContent = !d.card ? 'Pick a card picture on the Steam dashboard' : 'Connecting to Steam…'; }
      else {
        msg.className = 'hide'; $('card').className = '';
        if ($('cImg').getAttribute('src') !== d.card.url) $('cImg').src = d.card.url;
        var v = $('cVal'), b = d.card.box;
        v.style.left = b.left + '%'; v.style.top = b.top + '%'; v.style.width = b.width + '%'; v.style.height = b.height + '%';
        v.textContent = d.unlocked + ' / ' + d.total;
      }
    }
    fit();
  }
  function poll(){
    var x = new XMLHttpRequest();
    x.open('GET', '/api/steam?_=' + new Date().getTime(), true);
    x.onreadystatechange = function(){
      if (x.readyState !== 4 || x.status !== 200) return;
      try { var d = JSON.parse(x.responseText); if (d && d.ok) render(d); } catch (e) {}
    };
    x.send();
  }
  fit(); poll(); setInterval(poll, 2000);
})();
</script>
</body>
</html>
