<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ICB Team Contest</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: fixed; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; font-family: "Baloo 2", "Comic Sans MS", "Trebuchet MS", sans-serif; color: #fff; }
  #wrap { position: absolute; left: 20px; top: 20px; right: 20px; bottom: 20px; display: flex; flex-direction: column; align-items: center; transition: opacity .4s; }
  #wrap.hidden { opacity: 0; }
  .head { display: flex; align-items: center; justify-content: center; max-width: 100%; }
  .banner { margin-right: 20px; }
  .banner { position: relative; height: 190px; flex: none; }
  .banner img { height: 100%; display: block; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
  .banner .gt { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 64px; text-shadow: 0 3px 0 #000, 0 0 12px rgba(0,0,0,.6); }
  .title { font-size: 46px; font-weight: 900; text-align: center; line-height: 1.1; padding: 10px 34px; border-radius: 26px;
    background: linear-gradient(90deg, rgba(120,40,150,.9), rgba(220,80,170,.9)); border: 4px solid rgba(255,255,255,.85);
    text-shadow: 0 3px 0 #3a1446; box-shadow: 0 7px 0 rgba(58,20,70,.45); max-width: 1500px; }
  .title small { display: block; font-size: 26px; font-weight: 800; color: #ffe66d; }
  .teams { flex: 1; width: 100%; display: flex; justify-content: center; align-items: flex-start; margin-top: 18px; min-height: 0; }
  .team + .team { margin-left: 18px; }
  .team { position: relative; flex: 1 1 0; max-width: 380px; min-width: 0; display: flex; flex-direction: column; background: rgba(20,10,30,.82); border: 4px solid #fff; border-radius: 24px;
    box-shadow: 0 7px 0 rgba(0,0,0,.35); overflow: visible; transition: transform .4s, box-shadow .4s; }
  .team.leading { box-shadow: 0 0 34px rgba(255,230,109,.75), 0 7px 0 rgba(0,0,0,.35); }
  .team .top { background: #888; border-radius: 18px 18px 0 0; padding: 8px 12px 6px; text-align: center; color: #1b0f2a; }
  .team .nm { font-size: 32px; font-weight: 900; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team .join { font-size: 19px; font-weight: 800; opacity: .8; }
  .team .total { font-size: 74px; font-weight: 900; text-align: center; line-height: 1; padding: 10px 0 4px; text-shadow: 0 4px 0 rgba(0,0,0,.6); color: #fff; }
  .team .total.bump { animation: bump .5s; }
  @keyframes bump { 40% { transform: scale(1.25); } }
  .team .pts-label { text-align: center; font-size: 18px; font-weight: 800; opacity: .75; margin-top: -4px; }
  .team ul { list-style: none; margin: 8px 0 0; padding: 0 12px 12px; display: flex; flex-direction: column; overflow: hidden; }
  .team li + li { margin-top: 5px; }
  .team li { display: flex; align-items: center; background: rgba(255,255,255,.08); border-radius: 12px; padding: 4px 10px; font-size: 23px; font-weight: 800; transition: background .4s; }
  .team li.flash { background: rgba(255,230,109,.45); }
  .team li .n { margin-right: 8px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team li .p { font-variant-numeric: tabular-nums; color: #ffe66d; }
  .team li.more { justify-content: center; font-size: 19px; opacity: .8; background: none; }
  .team li.empty { justify-content: center; font-size: 19px; opacity: .6; background: none; font-weight: 700; }
  .crown { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); font-size: 54px; display: none; filter: drop-shadow(0 4px 4px rgba(0,0,0,.5)); animation: bob 1.4s ease-in-out infinite; }
  .team.leading .crown { display: block; }
  @keyframes bob { 0%,100% { transform: translate(-50%,0); } 50% { transform: translate(-50%,-8px); } }
  .float { position: absolute; left: 50%; top: 120px; font-size: 44px; font-weight: 900; pointer-events: none; text-shadow: 0 3px 0 #000; animation: up 1.4s ease-out forwards; }
  .float.neg { color: #ff8a8a; } .float.pos { color: #9dff9d; }
  @keyframes up { from { transform: translate(-50%,0); opacity: 1; } to { transform: translate(-50%,-110px); opacity: 0; } }
  .footer { margin-top: 14px; font-size: 26px; font-weight: 800; padding: 6px 26px; border-radius: 999px; background: rgba(20,10,30,.8); border: 3px solid rgba(255,255,255,.6); text-shadow: 0 2px 0 #000; text-align: center; }
  .footer b { color: #ffe66d; }
</style>
</head>
<body>
<div id="stage"><div id="wrap" class="hidden">
  <div class="head" id="head"></div>
  <div class="teams" id="teams"></div>
  <div class="footer" id="footer"></div>
</div></div>
<script>
// ICB Team Contest overlay (Baby, 2026-10-05). Meld layer:
//   http://127.0.0.1:8790/teams.html   (any size - the board scales to fit)
// Plain ES5 (Meld rule). Polls /api/teams every second.
(function(){
  var stage = document.getElementById('stage');
  // Meld's browser can report a 0x0 window at first load and doesn't always
  // fire 'resize' - so guard against 0 and re-fit on every poll.
  function fit(){
    var w = window.innerWidth || document.documentElement.clientWidth || 1600;
    var h = window.innerHeight || document.documentElement.clientHeight || 900;
    var s = Math.min(w / 1600, h / 900); if (!(s > 0)) s = 1;
    stage.style.transform = 'scale(' + s + ')'; stage.style.webkitTransform = 'scale(' + s + ')';
    stage.style.left = Math.max(0, (w - 1600 * s) / 2) + 'px'; }
  window.addEventListener('resize', fit); fit();
  var $ = function(id){ return document.getElementById(id); };
  var lastShape = '', lastHead = '', prevTotals = {}, prevPlayers = {}, first = true;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function renderHead(d, grand){
    var it = d.item || {};
    var key = [d.title, it.label, it.command, it.imageUrl, d.showBanner, it.valueBox ? JSON.stringify(it.valueBox) : ''].join('|');
    if (key !== lastHead) {
      lastHead = key;
      var html = '';
      if (d.showBanner && it.imageUrl) {
        html += '<div class="banner"><img src="' + esc(it.imageUrl) + '" alt="">';
        if (it.valueBox) html += '<div class="gt" id="gt" style="left:' + it.valueBox.left + '%;top:' + it.valueBox.top + '%;width:' + it.valueBox.width + '%;height:' + it.valueBox.height + '%"></div>';
        html += '</div>';
      }
      html += '<div class="title">' + esc(d.title || 'Team Contest') + (it.label ? '<small>Collecting: ' + esc(it.label) + '</small>' : '') + '</div>';
      $('head').innerHTML = html;
    }
    var gt = $('gt'); if (gt) gt.textContent = grand;
  }

  function build(d){
    var html = '';
    for (var i = 0; i < d.board.length; i++) {
      var t = d.board[i];
      html += '<div class="team" id="t-' + t.letter + '" style="border-color:' + esc(t.color) + '"><div class="crown">👑</div>' +
        '<div class="top" style="background:' + esc(t.color) + '"><div class="nm"></div><div class="join">!team ' + t.letter + '</div></div>' +
        '<div class="total" style="color:' + esc(t.color) + '">0</div><div class="pts-label">points</div><ul></ul></div>';
    }
    $('teams').innerHTML = html;
  }

  function floatAt(el, amount){
    var f = document.createElement('div');
    f.className = 'float ' + (amount < 0 ? 'neg' : 'pos');
    f.appendChild(document.createTextNode((amount > 0 ? '+' : '') + amount));
    el.appendChild(f);
    setTimeout(function(){ if (f.parentNode) f.parentNode.removeChild(f); }, 1500);
  }

  function render(d){
    fit();
    $('wrap').className = d.visible ? '' : 'hidden';
    var shape = d.board.map(function(t){ return t.letter + t.color; }).join('|');
    if (shape !== lastShape) { lastShape = shape; build(d); }
    var grand = 0, i, j;
    for (i = 0; i < d.board.length; i++) grand += d.board[i].total;
    renderHead(d, grand);
    for (i = 0; i < d.board.length; i++) {
      var t = d.board[i], el = $('t-' + t.letter); if (!el) continue;
      el.className = 'team' + (t.leading ? ' leading' : '');
      el.querySelector('.nm').textContent = t.name;
      var tot = el.querySelector('.total');
      var before = prevTotals[t.letter];
      tot.textContent = t.total;
      if (!first && before !== undefined && before !== t.total) {
        floatAt(el, t.total - before);
        tot.className = 'total'; void tot.offsetWidth; tot.className = 'total bump';
      }
      prevTotals[t.letter] = t.total;
      var max = d.showPlayers, html = '', shown = 0;
      if (max > 0) {
        for (j = 0; j < t.players.length && shown < max; j++, shown++) {
          var p = t.players[j], pk = t.letter + ':' + p.name.toLowerCase();
          var flash = !first && prevPlayers[pk] !== undefined && prevPlayers[pk] !== p.points;
          html += '<li' + (flash ? ' class="flash"' : '') + '><span class="n">' + esc(p.name) + '</span><span class="p">' + p.points + '</span></li>';
        }
        if (t.players.length > shown) html += '<li class="more">+' + (t.players.length - shown) + ' more</li>';
        if (!t.players.length) html += '<li class="empty">Type !team ' + t.letter + ' to join</li>';
      }
      el.querySelector('ul').innerHTML = html;
      for (j = 0; j < t.players.length; j++) prevPlayers[t.letter + ':' + t.players[j].name.toLowerCase()] = t.players[j].points;
    }
    // un-flash after a moment
    setTimeout(function(){ var f = document.querySelectorAll('li.flash'); for (var k = 0; k < f.length; k++) f[k].className = ''; }, 700);
    first = false;
    var it = d.item || {}, letters = [];
    for (i = 0; i < d.board.length; i++) letters.push(d.board[i].letter);
    var parts = [];
    if (d.joinOpen) parts.push('Join: <b>!team ' + letters.join('</b> / <b>') + '</b>');
    if (d.counting) parts.push('Score: <b>!' + esc(it.command) + '</b> (or <b>!' + esc(it.command) + ' +2</b> / <b>-1</b>)');
    else parts.push('⏸ Scoring is paused');
    $('footer').innerHTML = parts.join(' &nbsp;·&nbsp; ');
  }

  function poll(){
    var x = new XMLHttpRequest();
    x.open('GET', '/api/teams?_=' + new Date().getTime(), true);
    x.onreadystatechange = function(){
      if (x.readyState !== 4 || x.status !== 200) return;
      try { var d = JSON.parse(x.responseText); if (d && d.ok) render(d); } catch (e) {}
    };
    x.send();
  }
  poll(); setInterval(poll, 1000);
})();
</script>
</body>
</html>
