<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ijustababyTV stream timer</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;
    font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif}
  #stage{position:fixed;left:0;top:0;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center}
  #plate{
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:22px 34px 26px;
    border-radius:22px;
    background:rgba(40,10,60,0.38);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    backdrop-filter:blur(14px) saturate(160%);
    border:1px solid rgba(255,255,255,0.35);
    box-shadow:0 0 0 1px rgba(150,60,220,0.25),
               0 8px 30px rgba(30,0,50,0.45),
               inset 0 1px 0 rgba(255,255,255,0.25);
    opacity:0;
    transform:scale(0.94);
    transition:opacity 0.35s ease, transform 0.35s ease;
  }
  #plate.show{opacity:1;transform:scale(1)}
  #headrow{display:flex;align-items:center;gap:10px}
  #dot{
    width:11px;height:11px;border-radius:50%;
    background:#ff4d7e;
    box-shadow:0 0 8px 2px rgba(255,77,126,0.9);
    animation:pulse 1.5s ease-in-out infinite;
    flex:none;
  }
  #dot.still{animation:none;opacity:0.55;box-shadow:none}
  @keyframes pulse{
    0%{transform:scale(0.85);opacity:0.75}
    50%{transform:scale(1.15);opacity:1}
    100%{transform:scale(0.85);opacity:0.75}
  }
  #heading{
    margin:0;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
    color:#fff8ff;font-size:22px;line-height:1.1;text-align:center;
    text-shadow:0 0 10px rgba(255,255,255,0.85),0 0 22px rgba(210,140,255,0.8),0 2px 4px rgba(40,0,60,0.6);
  }
  #subheading{
    margin:0;font-weight:600;letter-spacing:0.04em;
    color:#f1d9ff;font-size:14px;text-align:center;opacity:0.9;
    text-shadow:0 0 8px rgba(210,140,255,0.6);
  }
  #digits{display:flex;align-items:center;gap:8px;margin-top:2px}
  .db{
    min-width:64px;padding:6px 10px;border-radius:12px;text-align:center;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.4);
    box-shadow:0 0 14px 2px rgba(190,110,255,0.55), inset 0 1px 0 rgba(255,255,255,0.3);
    font-size:40px;font-weight:700;color:#fff;
    text-shadow:0 0 12px rgba(255,255,255,0.95),0 0 26px rgba(190,110,255,0.9);
    font-variant-numeric:tabular-nums;
  }
  .colon{font-size:34px;font-weight:700;color:#fff8ff;opacity:0.85;
    text-shadow:0 0 10px rgba(210,140,255,0.7)}
  #celebrate{
    display:none;flex-direction:column;align-items:center;gap:4px;
  }
  #celebrate.show{display:flex}
  #celebrate .big{
    font-size:30px;font-weight:800;letter-spacing:0.06em;color:#fff8ff;
    text-shadow:0 0 14px rgba(255,255,255,0.95),0 0 34px rgba(255,140,210,0.95);
    animation:bounce 0.6s ease-in-out infinite alternate;
  }
  @keyframes bounce{ from{ transform:translateY(0) } to{ transform:translateY(-6px) } }
  .spark{
    position:absolute;font-size:20px;opacity:0;pointer-events:none;
    animation:spark 1.6s ease-out infinite;
  }
  @keyframes spark{
    0%{opacity:0;transform:translateY(0) scale(0.6)}
    15%{opacity:1}
    100%{opacity:0;transform:translateY(-46px) scale(1.15)}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="plate">
    <div id="headrow">
      <div id="dot"></div>
      <p id="heading">STARTING SOON</p>
    </div>
    <p id="subheading" style="display:none"></p>
    <div id="digits">
      <div class="db" id="mm">00</div>
      <div class="colon">:</div>
      <div class="db" id="ss">00</div>
    </div>
    <div id="celebrate">
      <div class="big">&#10024; LET'S GOOOO &#10024;</div>
    </div>
  </div>
</div>
<script>
(function(){
  // Plain ES5, XHR poll every 2s - same rules as every other Meld overlay page in this
  // project (ticker.html, the per-resource card pages). Modern syntax here has previously
  // rendered a blank layer inside Meld's embedded browser - do not "modernize" this file.
  var plate = document.getElementById('plate');
  var dot = document.getElementById('dot');
  var headingEl = document.getElementById('heading');
  var subheadingEl = document.getElementById('subheading');
  var digitsEl = document.getElementById('digits');
  var celebrateEl = document.getElementById('celebrate');
  var mmEl = document.getElementById('mm');
  var ssEl = document.getElementById('ss');

  var status = 'idle';         // 'idle' | 'running' | 'timesup'
  var targetAtMs = 0;
  var heading = 'STARTING SOON';
  var subheading = '';
  var haveSynced = false;
  var localCelebrating = false; // countdown hit 0 on this client before the server said so

  function twoDigits(n){
    n = Math.max(0, Math.floor(n));
    return n < 10 ? '0' + n : '' + n;
  }

  function renderText(){
    headingEl.textContent = heading;
    if (subheading) {
      subheadingEl.textContent = subheading;
      subheadingEl.style.display = 'block';
    } else {
      subheadingEl.style.display = 'none';
    }
  }

  function showCelebration(){
    digitsEl.style.display = 'none';
    celebrateEl.className = 'show';
    dot.className = 'still';
  }

  function showCountdown(){
    digitsEl.style.display = 'flex';
    celebrateEl.className = '';
    dot.className = '';
  }

  function tick(){
    if (!haveSynced) { return; }

    if (status === 'idle') {
      plate.className = '';
      localCelebrating = false;
      return;
    }

    plate.className = 'show';
    renderText();

    if (status === 'timesup') {
      showCelebration();
      return;
    }

    // status === 'running'
    var remainingMs = targetAtMs - Date.now();
    if (remainingMs <= 0) {
      // Countdown reached zero on this client. Celebrate locally right away rather than
      // waiting for the dashboard operator to click "Time's Up!" - a plain visual state,
      // never written back to the server (overlay pages are read-only clients).
      localCelebrating = true;
      showCelebration();
      return;
    }
    localCelebrating = false;
    showCountdown();
    var totalSeconds = Math.ceil(remainingMs / 1000);
    var mins = Math.floor(totalSeconds / 60);
    mmEl.textContent = twoDigits(mins);
    ssEl.textContent = twoDigits(totalSeconds - mins * 60);
  }

  function poll(){
    var x = new XMLHttpRequest();
    x.open('GET', '/api/settings?_=' + new Date().getTime(), true);
    x.onreadystatechange = function(){
      if (x.readyState !== 4) { return; }
      if (x.status !== 200) { return; }
      try {
        var d = JSON.parse(x.responseText);
        var c = (d.settings && d.settings.countdown) || {};
        status = (c.status === 'running' || c.status === 'timesup') ? c.status : 'idle';
        heading = (typeof c.heading === 'string' && c.heading) ? c.heading : 'STARTING SOON';
        subheading = (typeof c.subheading === 'string') ? c.subheading : '';
        var parsed = c.targetAt ? Date.parse(c.targetAt) : NaN;
        targetAtMs = isNaN(parsed) ? 0 : parsed;
        haveSynced = true;
        tick();
      } catch (e) { }
    };
    x.send();
  }

  poll();
  setInterval(poll, 2000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
