<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Plushie Wheel — Control</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px; background: #14101f; color: #eee; font-family: Arial, Helvetica, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: #cbb8ff; }
  .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; max-width: 1200px; }
  .panel { background: #1e1830; border: 1px solid #3a2f57; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  button { background: #4a3a80; color: #fff; border: none; border-radius: 6px; padding: 10px 16px; margin: 3px 6px 3px 0; cursor: pointer; font-size: 14px; }
  button:hover { background: #5c4aa0; }
  button:disabled { background: #333; color: #777; cursor: not-allowed; }
  button.danger { background: #7a2a2a; }
  button.danger:hover { background: #952f2f; }
  button.big { font-size: 18px; padding: 14px 24px; }
  .status-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  .status-row div { background: #14101f; border-radius: 6px; padding: 6px 10px; }
  .status-row b { color: #ffd94a; }
  #reveal { font-size: 15px; margin: 12px 0; min-height: 20px; }
  #log { font-size: 12px; max-height: 160px; overflow-y: auto; background: #14101f; border-radius: 6px; padding: 8px; }
  #log div { padding: 2px 0; border-bottom: 1px solid #2a2340; }
  label { display: block; font-size: 12px; margin: 8px 0 3px; color: #bbb; }
  input[type=text], input[type=number], select { width: 100%; box-sizing: border-box; background: #14101f; border: 1px solid #3a2f57; color: #eee; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  td, th { padding: 4px 6px; border-bottom: 1px solid #2a2340; text-align: left; }
  img.thumb { width: 32px; height: 32px; object-fit: contain; background: #000; border-radius: 4px; }
</style>
</head>
<body>
<h1>🎡 Plushie Wheel — Control</h1>
<div class="grid">
  <div>
    <div class="panel">
      <h2>Board</h2>
      <div class="status-row">
        <div>Boxes filled: <b id="stFilled">—</b> / 30</div>
        <div>Catalog size: <b id="stCatalog">—</b></div>
      </div>
      <div>
        <button class="big" id="btnShuffle">🔀 Shuffle Board</button>
        <button class="big" id="btnSpin">🎯 SPIN</button>
        <button id="btnClear">Clear result</button>
      </div>
      <div id="reveal"></div>
    </div>
    <div class="panel">
      <h2>Activity</h2>
      <div id="log"></div>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2>Add a plushie to the pool</h2>
      <label>Name</label>
      <input type="text" id="itemName" placeholder="e.g. Golden Bunny Plushie">
      <label>Type</label>
      <select id="itemType">
        <option value="plushie">Plushie</option>
        <option value="points">Channel Points</option>
      </select>
      <div id="pointsRow" style="display:none;">
        <label>Points value</label>
        <input type="number" id="itemPoints" placeholder="500">
      </div>
      <label>Image (optional)</label>
      <input type="file" id="itemImage" accept="image/png,image/jpeg,image/webp,image/gif">
      <button id="btnAddItem" style="margin-top:10px;">➕ Add to pool</button>
    </div>
    <div class="panel">
      <h2>Current pool (all eligible for the board)</h2>
      <table>
        <thead><tr><th></th><th>Name</th><th>Type</th><th></th></tr></thead>
        <tbody id="catalogBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts || {}));
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.ok === false) throw new Error(body.error || `Request to ${path} failed.`);
  return body;
}

function renderState(state) {
  const filled = (state.board || []).filter(b => b.kind === 'item').length;
  $('stFilled').textContent = filled;
  $('btnSpin').disabled = !state.canSpin;

  const reveal = $('reveal');
  if (state.revealed) {
    if (state.revealed.kind === 'item') {
      const it = state.revealed.item;
      reveal.innerHTML = `Landed on: <b style="color:#ffd94a;">${it.name}</b>${it.type === 'points' ? ` (${it.points} pts)` : ''}`;
    } else {
      reveal.innerHTML = `<i>Empty box — add plushies to the pool.</i>`;
    }
  } else {
    reveal.innerHTML = '';
  }

  $('log').innerHTML = (state.log || []).map(e =>
    `<div>${new Date(e.at).toLocaleTimeString()} — ${e.message}</div>`).join('');
}

async function run(path) {
  try {
    const state = await api(path, { method: 'POST' });
    renderState(state);
  } catch (e) {
    alert(e.message);
  }
}

$('btnShuffle').onclick = () => run('/api/tradeup/shuffle');
$('btnSpin').onclick = () => run('/api/tradeup/spin');
$('btnClear').onclick = () => run('/api/tradeup/clear');

$('itemType').onchange = () => {
  $('pointsRow').style.display = $('itemType').value === 'points' ? 'block' : 'none';
};

$('btnAddItem').onclick = async () => {
  const name = $('itemName').value.trim();
  if (!name) return alert('Name is required.');
  const type = $('itemType').value;
  const payload = { name, type };
  if (type === 'points') payload.points = Number($('itemPoints').value) || 0;

  const fileInput = $('itemImage');
  if (fileInput.files && fileInput.files[0]) {
    payload.imageDataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(fileInput.files[0]);
    });
  }

  try {
    const res = await api('/api/tradeup/items', { method: 'POST', body: JSON.stringify(payload) });
    $('itemName').value = '';
    $('itemImage').value = '';
    renderCatalog(res.config.items);
    $('stCatalog').textContent = res.config.items.length;
  } catch (e) {
    alert(e.message);
  }
};

function renderCatalog(items) {
  $('catalogBody').innerHTML = items.map(it => `
    <tr>
      <td>${it.image ? `<img class="thumb" src="${it.image}">` : ''}</td>
      <td>${it.name}${it.type === 'points' ? ` (${it.points} pts)` : ''}</td>
      <td>${it.type}</td>
      <td>
        <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" id="img-${it.id}" onchange="replaceImage('${it.id}')">
        <button onclick="document.getElementById('img-${it.id}').click()">${it.image ? '🖼 Replace' : '🖼 Add image'}</button>
        <button class="danger" onclick="deleteItem('${it.id}')">✕</button>
      </td>
    </tr>
  `).join('');
}

window.replaceImage = async (id) => {
  const fileInput = $(`img-${id}`);
  if (!fileInput.files || !fileInput.files[0]) return;
  try {
    const imageDataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(fileInput.files[0]);
    });
    const res = await api(`/api/tradeup/items/${id}`, { method: 'PUT', body: JSON.stringify({ imageDataUrl }) });
    renderCatalog(res.config.items);
  } catch (e) {
    alert(e.message);
  }
};

window.deleteItem = async (id) => {
  if (!confirm('Remove this from the pool?')) return;
  try {
    const res = await api(`/api/tradeup/items/${id}`, { method: 'DELETE' });
    renderCatalog(res.config.items);
    $('stCatalog').textContent = res.config.items.length;
  } catch (e) {
    alert(e.message);
  }
};

async function init() {
  const state = await api('/api/tradeup/state');
  renderState(state);
  const cfg = await api('/api/tradeup/config');
  renderCatalog(cfg.config.items);
  $('stCatalog').textContent = cfg.config.items.length;
}

async function poll() {
  try {
    const state = await api('/api/tradeup/state');
    renderState(state);
  } catch (e) {}
}

init();
setInterval(poll, 2000);
</script>
</body>
</html>
