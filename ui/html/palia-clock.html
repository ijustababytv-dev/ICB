<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ICB Palia Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/palia-clock.css">
</head>
<body>
<div id="wrap"><div id="card">
  <div class="top"><div id="sky"><div id="orb"><span id="orbI">☀️</span></div></div>
    <div class="tt"><div class="lbl" id="title">Palia Time</div><div id="time">6:00<small>AM</small></div><div id="real"></div></div></div>
  <div id="bar"><div id="pin"></div></div>
  <div class="ticks"><span style="left:0%">12a</span><span style="left:25%">6a</span><span style="left:50%">12p</span><span style="left:75%">6p</span><span style="left:100%">12a</span></div>
  <div id="next"></div>
  <div id="ring"><div class="rt" id="ringT"></div><div class="rs" id="ringS"></div></div>
</div></div>
<script src="/js/client/palia-clock.js"></script>
</body>
</html>
