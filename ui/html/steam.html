<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ICB Steam Achievements</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/steam.css">
</head>
<body>
<div id="stage">
  <div id="popWrap"><div class="pop" id="pop"><img id="pImg" alt=""><div class="txt"><div class="kicker">🏅 ACHIEVEMENT UNLOCKED!</div><div class="nm" id="pName"></div><div class="ds" id="pDesc"></div><span class="rar" id="pRar"></span></div></div></div>
  <div id="prog" class="hide">
    <div class="top"><div class="ttl" id="gTitle"></div><div class="cnt" id="gCount"></div></div>
    <div class="bar"><i id="gBar"></i></div>
    <div class="row" id="gRecent"></div>
    <div class="stats" id="gStats"></div>
  </div>
  <div id="card" class="hide"><img id="cImg" alt=""><div class="val" id="cVal"></div></div>
  <div id="msg" class="hide"></div>
</div>
<script src="/js/client/steam.js"></script>
</body>
</html>
