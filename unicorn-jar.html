      } else {

        b = makeUnicorn(owner, floorSlots[slotCol] + (Math.random() - 0.5) * R * 1.2, H - R - slotRow * 2.3 * R - Math.random() * R * 1.5);
        floorIndex++;
      }
    }
    // Let them tumble into a natural heap before the first frame is shown.
    for (i = 0; i < 360; i++) Engine.update(engine, 1000 / 60);
  }

  // Bring the drawn unicorns in line with ICB's counts.
  function applyState(g, first){
    var want = {}, total = 0, key, e, n;
    // The jar shows only unicorns earned this stream (g.jar.counts); everyone's
    // full rolled-over count still decides the drawings on the server.
    if (g.jar && g.jar.counts) {
      for (key in g.jar.counts) {
        if (!Object.prototype.hasOwnProperty.call(g.jar.counts, key)) continue;
        n = g.jar.counts[key];
        if (n > 0) { want[key] = n; total += n; }
      }
    } else {
      var map = g.entrants || {};
      for (key in map) {
        if (!Object.prototype.hasOwnProperty.call(map, key)) continue;
        e = map[key];
        n = (e.chatTickets || 0) + (e.subTickets || 0) + (e.giftTickets || 0) + (e.bitsTickets || 0) + (e.manualTickets || 0);
        if (n > 0) { want[e.username || key] = n; total += n; }
      }
    }
    totalEntries = total;
    if (total === 0) { if (bodies.length || dropQueue.length) clearAll(); return; }

    // Remove extras (queued first, then hidden, then drawn).
    var names = {}, o;
    for (o in owners) names[o] = true;
    for (o in queuedByOwner) names[o] = true;
    for (o in hiddenByOwner) names[o] = true;
    for (o in names) {
      var have = (owners[o] ? owners[o].length : 0) + (queuedByOwner[o] || 0) + (hiddenByOwner[o] || 0);
      var extra = have - (want[o] || 0);
      while (extra > 0 && queuedByOwner[o]) {
        var qi = dropQueue.lastIndexOf(o);
        if (qi >= 0) dropQueue.splice(qi, 1);
        queuedByOwner[o]--; extra--;
      }
      while (extra > 0 && hiddenByOwner[o]) { hiddenByOwner[o]--; extra--; }
      while (extra > 0 && owners[o] && owners[o].length) {
        var victim = owners[o][owners[o].length - 1];
        if (victim === winnerBody) break;
        removeUnicorn(victim); extra--;
      }
    }

    // Add what's missing.
    var toPlace = [], added = 0;
    for (o in want) {
      var has = (owners[o] ? owners[o].length : 0) + (queuedByOwner[o] || 0) + (hiddenByOwner[o] || 0);
      for (var k = has; k < want[o]; k++) {
        if (first) toPlace.push(o);
        else { dropQueue.push(o); queuedByOwner[o] = (queuedByOwner[o] || 0) + 1; added++; }
      }
    }
    if (!first && added >= 5) {
      triggerRainbow(3500 + Math.min(4000, added * 60)); // transient sparkle burst
      spawnAccentShower(added); // + a few stars/rainbows that fall in and stay
    }
    if (first && toPlace.length) {
      // Shuffle so the jar isn't sorted by viewer.
      for (var s = toPlace.length - 1; s > 0; s--) { var r = Math.floor(Math.random() * (s + 1)); var tmp = toPlace[s]; toPlace[s] = toPlace[r]; toPlace[r] = tmp; }
      placeInstantly(toPlace);
    }
  }

  // ---------------------------------------------------------------- drawing
  function wakeAll(){ for (var i = 0; i < bodies.length; i++) Sleeping.set(bodies[i], false); }

  function rotateJarToward(target, frac){
    var d = (target - J.angle) * frac;
    if (Math.abs(target - J.angle) < 0.002) d = target - J.angle;
    if (d !== 0) { Body.rotate(jar, d, J.pivot); J.angle += d; }
  }

  function startFlight(b, ex, ey, dur, delay, scaleTo, arc, onDone){
    flights.push({ b: b, started: false, t0: Date.now() + (delay || 0), dur: dur, ex: ex, ey: ey,
      sx: 0, sy: 0, scaleFrom: b.renderScale || 1, scaleTo: scaleTo, arc: arc || 0, onDone: onDone });
  }

  function ease(p){ return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

  function updateFlights(now){
    for (var i = flights.length - 1; i >= 0; i--) {
      var f = flights[i];
      if (bodies.indexOf(f.b) < 0) { flights.splice(i, 1); continue; }
      if (now < f.t0) continue;
      if (!f.started) {
        f.started = true; f.sx = f.b.position.x; f.sy = f.b.position.y;
        f.b.collisionFilter.mask = 0; Sleeping.set(f.b, false);
      }
      var p = Math.min(1, (now - f.t0) / f.dur), e = ease(p);
      Body.setPosition(f.b, { x: f.sx + (f.ex - f.sx) * e, y: f.sy + (f.ey - f.sy) * e - f.arc * Math.sin(Math.PI * p) });
      Body.setVelocity(f.b, { x: 0, y: 0 });
      f.b.renderScale = f.scaleFrom + (f.scaleTo - f.scaleFrom) * e;
      if (p >= 1) {
        flights.splice(i, 1);
        if (f.onDone) f.onDone(f.b);
      }
    }
  }

  function release(b){ b.collisionFilter.mask = DEFAULT_FILTER_MASK; Body.setVelocity(b, { x: 0, y: 1 }); }

  function burstConfetti(x, y){
    var colors = ['#ff7ad9', '#c084fc', '#ffd36e', '#ffffff', '#ff4fb8'];
    for (var i = 0; i < 140; i++) {
      var a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 11;
      confetti.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, life: 1,
        size: 5 + Math.random() * 7, color: colors[i % colors.length], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4 });
    }
  }

  function setPhase(p, now){ phase = p; phaseStart = now; }

  // Reset pressed mid-draw: stop the show, stand the jar back up.
  function abortDraw(){
    drawQueue = [];
    for (var i = 0; i < flights.length; i++) release(flights[i].b);
    flights = [];
    if (winnerBody) { winnerBody.renderScale = 1; release(winnerBody); }
    winnerBody = null; current = null; confetti = [];
    engine.gravity.y = 1;
    try { drawAudio.pause(); } catch (e) {}
    rotateJarToward(0, 1);
    wakeAll();
    setPhase('idle', Date.now());
  }

  // Full rolled-over counts per viewer (what the drawing uses) and the
  // latest state, kept so the jar can be put back after a drawing.
  var fullTotals = {}, lastG = null, rainList = [], rainStartedAt = 0, rainSpawned = 0;

  function buildRainList(){
    // Baby (2026-09-26): the drawing now only uses the unicorns already in
    // the jar / on screen - no extra rain of everyone's rolled-over unicorns.
    // (Winner odds are still from everyone's full count, picked by ICB.)
    if (DRAW_JAR_ONLY) return [];
    var list = [], o, have, need, k;
    for (o in fullTotals) {
      if (!Object.prototype.hasOwnProperty.call(fullTotals, o)) continue;
      have = owners[o] ? owners[o].length : 0;
      need = fullTotals[o] - have;
      for (k = 0; k < need; k++) list.push(o);
    }
    for (var s2 = list.length - 1; s2 > 0; s2--) { var r2 = Math.floor(Math.random() * (s2 + 1)); var t2 = list[s2]; list[s2] = list[r2]; list[r2] = t2; }
    return list.slice(0, Math.max(0, MAX_BODIES - bodies.length));
  }

  function rainOne(owner){
    var cw = cloudW();
    var x = Math.max(R, Math.min(W - R, cloud.x + (Math.random() - 0.5) * cw * 0.7));
    var b = makeUnicorn(owner, x, cloud.y + R * 0.6);
    Body.setVelocity(b, { x: (Math.random() - 0.5) * 4, y: 3 + Math.random() * 3 });
    Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.4);
    if (Math.random() < 0.5) sparkleAt(x, cloud.y + R, 1);
  }

  // Push anything still inside the tipped jar out through its mouth.
  function spillJar(){
    var mx = Math.sin(J.angle), my = -Math.cos(J.angle);
    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      if (isInJar(b) && Math.random() < 0.5) {
        Sleeping.set(b, false);
        var sp = 6 + Math.random() * 7;
        Body.setVelocity(b, { x: mx * sp + (Math.random() - 0.5) * 3, y: my * sp - (2 + Math.random() * 4) });
      }
    }
  }

  // The lottery machine: a swirling wind that keeps everything airborne.
  function lotteryMix(now, k){
    for (var i = 0; i < bodies.length; i++) {
      var b = bodies[i];
      if (b === winnerBody || b.collisionFilter.mask === 0) continue;
      Sleeping.set(b, false);
      var vx = b.velocity.x + Math.sin(b.position.y * 0.005 + now * 0.0021 + b.id) * 0.9 * k + (Math.random() - 0.5) * 0.8 * k;
      var vy = b.velocity.y + Math.cos(b.position.x * 0.005 + now * 0.0017 + b.id * 0.7) * 0.9 * k + (Math.random() - 0.5) * 0.8 * k;
      if (b.position.y > H - R * 3.5 && Math.random() < 0.12 * k) vy = -(10 + Math.random() * 12);
      var sp = Math.sqrt(vx * vx + vy * vy), max = 20;
      if (sp > max) { vx *= max / sp; vy *= max / sp; }
      Body.setVelocity(b, { x: vx, y: vy });
      if (Math.random() < 0.05) Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.6);
    }
  }

  function updateDraw(now){
    if (phase === 'idle') {
      if (!drawQueue.length) return;
      current = drawQueue.shift();
      winnerBody = null;
      wakeAll();
      rainList = buildRainList(); rainSpawned = 0; rainStartedAt = now;
      cloud.inited = true; cloud.x = W / 2;
      current.mixMs = mixMsFor(); // lock in the target for this drawing (song may still be loading)
      playSound(drawAudio);
      setPhase('rain', now);
      return;
    }
    var t = now - phaseStart;

    if (phase === 'rain') {
      // Jar tips and spills while the cloud rains every unicorn on file.
      rotateJarToward(J.tipAngle, t < TIP_MS ? 0.09 : 1);
      if (t > TIP_MS * 0.6) spillJar();
      var due = Math.min(rainList.length, Math.ceil(rainList.length * Math.min(1, t / (RAIN_MS - 1000))));
      while (rainSpawned < due) rainOne(rainList[rainSpawned++]);
      cloud.lastUse = now;
      if (t > RAIN_MS) { engine.gravity.y = 0.35; swirlAccents(160, current.mixMs + COUNTDOWN_MS); setPhase('mix', now); }
      return;
    }

    if (phase === 'mix') {
      spillJar();
      lotteryMix(now, 0.8 + 0.4 * Math.min(1, t / 1500));
      if (t > current.mixMs) setPhase('countdown', now);
      return;
    }

    if (phase === 'countdown') {
      lotteryMix(now, 1.2 + 0.6 * (t / COUNTDOWN_MS));
      if (t > COUNTDOWN_MS) { engine.gravity.y = 1; setPhase('rise', now); }
      return;
    }

    if (phase === 'rise') {
      if (t === 0 || !current.riseStarted) {
        current.riseStarted = true;
        playSound(winnerAudio);
        var pool = owners[current.username] || [];
        winnerBody = pool.length ? pool[Math.floor(Math.random() * pool.length)]
                   : (bodies.length ? bodies[Math.floor(Math.random() * bodies.length)] : null);
        if (winnerBody) {
          startFlight(winnerBody, W / 2, H * 0.3, RISE_MS, 0, 4.2, 60, function(){
            burstConfetti(W / 2, H * 0.3);
            sparkleAt(W / 2, H * 0.3, 40);
          });
        } else {
          burstConfetti(W / 2, H * 0.3);
        }
        current.bannerAt = now + (winnerBody ? RISE_MS : 0);
      }
      if (winnerBody) {
        // Hold it in place (flight finished) while the banner shows.
        if (!flightFor(winnerBody)) { Body.setPosition(winnerBody, { x: W / 2, y: H * 0.3 + Math.sin(now / 300) * 6 }); Body.setVelocity(winnerBody, { x: 0, y: 0 }); }
      }
      // (No cut-off here any more - the song plays on to its end; see songFadeTick.)
      if (now > current.bannerAt + BANNER_MS) {

          var wb = winnerBody;
          startFlight(wb, W / 2, H * 0.3, 500, 0, 1, 0, function(b){ release(b); });

      return;
    }

    if (phase === 'gather') {

      if (t > 500) winnerBody = null;

      return;
    }

    if (phase === 'upright') {
      rotateJarToward(0, 0.08);
      if (t > UPRIGHT_MS) { rotateJarToward(0, 1); wakeAll(); setPhase('refill', now); startRefill(now); }
      return;
    }

    if (phase === 'refill') {

      }
    }
  }

  // After the reveal, only this stream's unicorns stay; the rest fly home.
  function startGather(now){
    var keep = (lastG && lastG.jar && lastG.jar.counts) ? lastG.jar.counts : null;
    if (!keep) return;
    var cw = cloudW(), n = 0, o, list, extra, i;
    for (o in owners) {
      if (!Object.prototype.hasOwnProperty.call(owners, o)) continue;
      list = owners[o].slice();
      // Prefer sending home the ones that are highest up / furthest from the jar.
      list.sort(function(a, b){ return a.position.y - b.position.y; });
      extra = list.length - (keep[o] || 0);
      for (i = 0; i < extra; i++) {
        (function(b, k){
          startFlight(b, W / 2 + (Math.random() - 0.5) * cw * 0.5, Math.max(60, cw * 0.28), 900, Math.min(1500, k * 6), 0.35, 80, function(bb){ removeUnicorn(bb); });
        })(list[i], n++);

  }

  function flightFor(b){ for (var i = 0; i < flights.length; i++) if (flights[i].b === b) return flights[i]; return null; }

  function startRefill(now){
    var need = J.capacity - inJarCount();
    var outside = [];
    for (var i = 0; i < bodies.length; i++) if (!isInJar(bodies[i])) outside.push(bodies[i]);
    outside.sort(function(a, b){
      return Math.abs(a.position.x - J.cx) + (H - a.position.y) * 0.5 - (Math.abs(b.position.x - J.cx) + (H - b.position.y) * 0.5);
    });
    var n = Math.min(need, outside.length);
    for (var k = 0; k < n; k++) {
      var ex = J.mouthLeft + R + Math.random() * Math.max(1, J.mouthRight - J.mouthLeft - 2 * R);
      startFlight(outside[k], ex, J.innerTop - R * 2 - (k % 4) * R, 650, k * 30, 1, 120, release);
    }

  }

  // -------------------------------------------------------------- rendering
  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  function jarTransform(){
    ctx.translate(J.pivot.x, J.pivot.y); ctx.rotate(J.angle); ctx.translate(-J.pivot.x, -J.pivot.y);
  }

  function drawJarImage(img, alpha){
    if (!img.complete || !img.naturalWidth) return;
    ctx.save(); jarTransform();
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, J.ox, J.oy, JAR_IMG_W * J.s, JAR_IMG_H * J.s);
    ctx.restore();
  }

  function drawJarBack(){ drawJarImage(JAR_BACK, 1); }

  // Extra glass sheen over the unicorns when the real front panel is used:
  // the back panel's walls redrawn faintly on top so the contents look like
  // they're behind curved glass, not pasted in front of it. 0 = off.
  var FRONT_SHEEN_ALPHA = (window.__sheen !== undefined) ? window.__sheen : 0.3;

  function drawJarFront(){
    if (frontUsable) {
      if (FRONT_SHEEN_ALPHA > 0) drawJarImage(JAR_BACK, FRONT_SHEEN_ALPHA);
      drawJarImage(JAR_FRONT, 1);
    }
    else drawJarImage(JAR_BACK, FRONT_FALLBACK_ALPHA);
    ctx.save(); jarTransform();
    // count tag, on the front of the glass
    var label = String(totalEntries);
    var fs = Math.max(20, Math.min(40, J.w * 0.1));
    ctx.font = '900 ' + fs + 'px ' + FONT;
    var iconW = fs * 1.3, tw = ctx.measureText(label).width;
    var tagW = tw + iconW + fs * 1.1, tagH = fs * 1.55;
    var tx = J.cx - tagW / 2, ty = J.oy + 820 * J.s;

    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,215,248,0.9)'; ctx.stroke();

    ctx.fillStyle = '#fff2fd'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.shadowColor = 'rgba(255,120,230,0.9)'; ctx.shadowBlur = 8;
    ctx.fillText(label, tx + fs * 0.4 + iconW + fs * 0.25, ty + tagH / 2 + 1);
    ctx.restore();
  }

  // Each viewer's name is printed on their unicorns. The label is drawn once
  // per name into a small canvas and reused every frame (fast even with
  // hundreds of unicorns). Names stay upright while the unicorns tumble.
  // Long names shrink a little, then get cut off with "..." so they fit.
  var showNames = false;
  var labelCache = {};
  // Split a name into up to two lines that each fit maxW. Prefers breaking
  // at "_" or where lowercase meets uppercase/digit (haley_|please_hush,
  // Sammie|Sparkle, kjdragon|2018); otherwise splits wherever it fits.
  function wrapName(g, name, maxW){
    if (g.measureText(name).width <= maxW) return [name];
    var best = null, bestScore = Infinity;
    for (var i = 1; i < name.length; i++) {
      var a = name.slice(0, i), b = name.slice(i);
      var natural = name.charAt(i - 1) === '_' || name.charAt(i) === '_' ||
        (/[a-z]/.test(name.charAt(i - 1)) && /[A-Z0-9]/.test(name.charAt(i)));

    }
    return best;
  }

  function nameLabel(name){
    if (labelCache[name]) return labelCache[name];
    var maxW = R * 2.5, px = Math.max(10, Math.round(R * 0.6)), minPx = Math.max(8, Math.round(R * 0.46));
    var c = document.createElement('canvas'), g = c.getContext('2d');
    var lines = null;
    // Shrink a little if needed; take the first size where it fits on 1-2 lines.
    for (; px >= minPx; px--) {
      g.font = '800 ' + px + 'px ' + FONT;
      lines = wrapName(g, name, maxW);
      if (lines) break;
    }
    if (!lines) {
      // Very long names: two full lines, the second ends with "...".
      px = minPx; g.font = '800 ' + px + 'px ' + FONT;
      var first = name;
      while (first.length > 1 && g.measureText(first).width > maxW) first = first.slice(0, -1);
      var rest = name.slice(first.length);
      while (rest.length > 1 && g.measureText(rest + '…').width > maxW) rest = rest.slice(0, -1);
      lines = [first, rest + '…'];

    var pad = 4, lineH = Math.round(px * 1.05), tw = 0;
    for (var k = 0; k < lines.length; k++) tw = Math.max(tw, Math.ceil(g.measureText(lines[k]).width));
    c.width = tw + pad * 2; c.height = lineH * lines.length + pad * 2 + 2;
    g.font = '800 ' + px + 'px ' + FONT;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineJoin = 'round'; g.lineWidth = Math.max(2.5, px * 0.28);
    for (var n = 0; n < lines.length; n++) {

      g.strokeStyle = 'rgba(70,0,80,0.95)'; g.strokeText(lines[n], c.width / 2, y);
      g.fillStyle = '#ffffff'; g.fillText(lines[n], c.width / 2, y);
    }

    return c;
  }

  function drawAccent(b){
    var img = b.accentImg;
    if (!img) return;
    var s = b.renderScale || 1, w = R * (img === FX.rainbow ? 2.4 : 1.0) * s, h = w * img.height / img.width;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function drawUnicorn(b, glow){
    var s = b.renderScale || 1, w = R * 2.4 * s, h = w * UNI_ASPECT;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(glow ? Math.sin(Date.now() / 400) * 0.15 : b.angle);
    if (glow) { ctx.shadowColor = 'rgba(255,120,230,1)'; ctx.shadowBlur = 45; }
    ctx.drawImage(UNI, -w / 2, -h / 2, w, h);
    ctx.restore();
    if (showNames && b.owner) {
      var lab = nameLabel(b.owner);
      var lw = lab.width * s, lh = lab.height * s;
      ctx.drawImage(lab, b.position.x - lw / 2, b.position.y + R * 0.15 * s - lh / 2, lw, lh);
    }
  }

  function drawCountdown(now){
    if (phase !== 'countdown') return;
    var t = now - phaseStart, left = Math.max(1, Math.ceil((COUNTDOWN_MS - t) / 1000));
    var frac = 1 - (((COUNTDOWN_MS - t) / 1000) % 1);          // 0 at each new number -> 1
    var scale = 1.35 - 0.35 * Math.min(1, frac * 3);
    ctx.save();
    ctx.translate(W / 2, H * 0.42);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.95;
    ctx.font = '800 38px ' + FONT;
    ctx.fillStyle = '#ffe3fb'; ctx.shadowColor = 'rgba(120,0,120,0.9)'; ctx.shadowBlur = 12;
    ctx.fillText('WINNER IN', 0, -150);
    ctx.scale(scale, scale);
    ctx.font = '900 230px ' + FONT;
    ctx.lineJoin = 'round'; ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(110,0,120,0.95)';
    ctx.shadowColor = left <= 3 ? 'rgba(255,215,110,1)' : 'rgba(255,110,220,1)'; ctx.shadowBlur = 40;
    ctx.strokeText(String(left), 0, 10);
    ctx.fillStyle = left <= 3 ? '#fff4c9' : '#ffffff';
    ctx.fillText(String(left), 0, 10);
    ctx.restore();
  }

  function drawBanner(now){
    if (!current || !current.bannerAt || now < current.bannerAt) return;
    if (phase !== 'rise') return;
    var age = now - current.bannerAt;
    var alpha = Math.min(1, age / 300);
    // Baby (2026-09-26): a custom prize name (set on the dashboard) overrides
    // the generic "Plushie"/"Mystery Outfit" wording, e.g. "Squishmallow Corgi".
    var prize = current.prizeLabel || (current.prize === 'mystery-outfit' ? 'Mystery Outfit' : 'Plushie');
    var name = current.username;
    var cy = H * 0.3 + (winnerBody ? R * 4.2 * 1.3 : 0) + 40;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var nameSize = 78;
    ctx.font = '900 ' + nameSize + 'px ' + FONT;
    while (ctx.measureText(name).width > W * 0.7 && nameSize > 30) { nameSize -= 4; ctx.font = '900 ' + nameSize + 'px ' + FONT; }
    var boxW = Math.max(ctx.measureText(name).width + 120, 560), boxH = nameSize + 130;
    roundRect(W / 2 - boxW / 2, cy - 45, boxW, boxH, 36);
    var bg = ctx.createLinearGradient(0, cy - 45, 0, cy - 45 + boxH);
    bg.addColorStop(0, 'rgba(150,30,150,0.9)'); bg.addColorStop(1, 'rgba(90,20,140,0.9)');
    ctx.fillStyle = bg; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,215,130,0.95)';
    ctx.shadowColor = 'rgba(255,200,110,0.9)'; ctx.shadowBlur = 25; ctx.stroke(); ctx.shadowBlur = 0;
    ctx.font = '800 30px ' + FONT; ctx.fillStyle = '#ffe9c9';
    ctx.fillText('WINNER!', W / 2, cy - 8);
    if (current.isTest) {
      // Baby (2026-09-27): the demo/test draw looks the same as a real one,
      // but a small tag makes it obvious to anyone watching that this run
      // didn't pick a real player and isn't going in the Winners Circle.
      ctx.save();
      ctx.font = '700 20px ' + FONT; ctx.fillStyle = '#fff2a8';
      ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 6;
      ctx.fillText('TEST DRAW - just a demo', W / 2, cy - 45 - 34);
      ctx.restore();
    }
    ctx.font = '900 ' + nameSize + 'px ' + FONT; ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(255,120,230,1)'; ctx.shadowBlur = 20;
    ctx.fillText(name, W / 2, cy + 18 + nameSize / 2);
    ctx.shadowBlur = 0;
    ctx.font = '800 30px ' + FONT; ctx.fillStyle = '#ffe3fb';
    ctx.fillText('wins the ' + prize + '!', W / 2, cy + nameSize + 55);
    ctx.restore();
  }

  function drawConfetti(){
    for (var i = confetti.length - 1; i >= 0; i--) {
      var c = confetti[i];
      c.vy += 0.25; c.vx *= 0.99; c.x += c.vx; c.y += c.vy; c.rot += c.vr; c.life -= 0.006;
      if (c.life <= 0 || c.y > H + 20) { confetti.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = Math.min(1, c.life * 2);
      ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.fillStyle = c.color;
      ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
      ctx.restore();
    }
  }

  function render(now){
    ctx.clearRect(0, 0, W, H);
    if (!settings) return;
    drawJarBack();
    for (var i = 0; i < bodies.length; i++) {
      if (bodies[i] === winnerBody) continue;
      if (bodies[i].isAccent) drawAccent(bodies[i]); else drawUnicorn(bodies[i], false);
    }
    drawJarFront();
    drawSparks(now);
    if (winnerBody) drawUnicorn(winnerBody, true);
    drawCloud();
    drawCountdown(now);
    drawBanner(now);
    drawConfetti();
  }

  // ------------------------------------------------------------------- loop
  function frame(){
    songFadeTick();
    var now = Date.now();
    if (settings) {
      if (phase === 'idle' && dropQueue.length) {
        var interval = dropQueue.length > 40 ? 25 : 70;
        if (now - lastDropAt > interval) {
          lastDropAt = now;
          var o = dropQueue.shift();
          queuedByOwner[o] = Math.max(0, (queuedByOwner[o] || 0) - 1);
          spawnDrop(o);
        }
      }
      updateCloud(now);
      updateDraw(now);
      updateFlights(now);
      Engine.update(engine, 1000 / 60);
    }
    render(now);
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------- data
  function onState(g){
    var d = g.display || {};
    if (!settings) {
      init(d);
      applyState(g, true);
      lastWinnerCount = (g.winners || []).length;
      lastTestSeq = (g.testDraw && g.testDraw.seq) || 0;
      lastG = g;
      return;
    }
    showNames = d.showNames === true;
    magic = d.magic !== false;
    if ((d.jarSide && d.jarSide !== settings.jarSide) || (d.unicornSize && d.unicornSize !== settings.unicornSize)) {
      window.location.reload();
      return;
    }
    var winners = g.winners || [];
    if (winners.length > lastWinnerCount) {
      for (var i = lastWinnerCount; i < winners.length; i++) drawQueue.push({ username: winners[i].username, prize: winners[i].prize, prizeLabel: winners[i].prizeLabel });
    } else if (winners.length < lastWinnerCount) {
      abortDraw();
    }
    lastWinnerCount = winners.length;
    // Baby (2026-09-27): the "Test" button on the dashboard - runs the same
    // show but always picks IJustABabyTv, without ever touching winners,
    // entrants, or the activity log, so demos never leak into anything real.
    var td = g.testDraw || {};
    if ((td.seq || 0) > lastTestSeq) {
      drawQueue.push({ username: 'IJustABabyTv', prize: td.prize || 'plushie', prizeLabel: d.currentPrizeLabel || '', isTest: true });
    }
    lastTestSeq = td.seq || 0;
    lastG = g;
    fullTotals = {};
    var ents = g.entrants || {};
    for (var key in ents) {
      if (!Object.prototype.hasOwnProperty.call(ents, key)) continue;
      var en = ents[key], tot = (en.chatTickets || 0) + (en.subTickets || 0) + (en.giftTickets || 0) + (en.bitsTickets || 0) + (en.manualTickets || 0);
      if (tot > 0) fullTotals[en.username || key] = tot;
    }
    // During a drawing the screen holds everyone's unicorns; the jar is put
    // back to this stream's count when the show ends.
    if (phase === 'idle' && !drawQueue.length) applyState(g, false);
  }

  function poll(){
    var x = new XMLHttpRequest();
    x.open('GET', '/api/giveaway/state?_=' + new Date().getTime(), true);
    x.onreadystatechange = function(){
      if (x.readyState !== 4 || x.status !== 200) return;
      try { var d = JSON.parse(x.responseText); if (d && d.giveaway) onState(d.giveaway); } catch (e) {}
    };
    x.send();
  }

  // Test hook for the dashboard-less preview (harmless on stream).
  window.__jar = { state: function(){ return { bodies: bodies.length, inJar: settings ? inJarCount() : 0, capacity: J.capacity, phase: phase, angle: J.angle, total: totalEntries, queued: dropQueue.length, soundPlaying: !drawAudio.paused, soundTime: Math.round(drawAudio.currentTime * 10) / 10, soundVolume: drawAudio.volume, songMs: songMs, mixMs: current ? current.mixMs : mixMsFor(), isTest: current ? !!current.isTest : false }; } };

  poll();
  setInterval(poll, 1000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
